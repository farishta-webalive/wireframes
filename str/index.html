                  <Icon name="more-vertical" :size="18" aria-hidden="true"/>
                </span>
                <div v-else class="relative inline-block">
                  <button type="button"
                          @click="toggleMenu(o.id, $event)"
                          @keydown.escape="menuFor = null"
                          :aria-expanded="menuFor === o.id"
                          aria-haspopup="menu"
                          aria-label="Order actions"
                          class="p-1.5 rounded-md text-slate-500 hover:text-navy-900 hover:bg-slate-100 focus-ring">
                    <Icon name="more-vertical" :size="18" aria-hidden="true"/>
                  </button>
                  <div v-if="menuFor === o.id"
                       role="menu"
                       @click.stop
                       class="absolute right-0 top-full mt-1 w-48 bg-white border border-slate-200 rounded-md shadow-lg py-1 z-20 text-left">
                    <a href="#" role="menuitem" @click.stop.prevent="viewPdf(o, $event)" class="flex items-center gap-2 px-4 py-2 text-sm text-slate-800 hover:bg-slate-50">
                      <Icon name="file-text" :size="14" cls="text-slate-500"/> View as PDF
                    </a>
                    <template v-if="o.status !== 'Completed'">
                      <a href="#" role="menuitem" @click.stop.prevent="editOrder(o, $event)" class="flex items-center gap-2 px-4 py-2 text-sm text-slate-800 hover:bg-slate-50">
                        <Icon name="pencil" :size="14" cls="text-slate-500"/> Edit
                      </a>
                    </template>
                  </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Pagination strip (Xero/MYOB legacy-ops pattern: Prev / Page X of Y / Next + size selector) -->
    <nav v-if="!loading && filtered.length > 0"
         aria-label="Orders pagination"
         class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 text-sm">
      <div class="text-slate-600">
        Showing {{ rangeStart }}&ndash;{{ rangeEnd }} of {{ filtered.length }}
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <label class="hidden md:inline-flex items-center gap-2 text-slate-600">
          Rows per page
          <select v-model.number="pageSize"
                  class="h-11 pl-3 rounded-md border border-slate-300 text-base focus-ring bg-white">
            <option :value="25">25</option>
            <option :value="50">50</option>
            <option :value="100">100</option>
          </select>
        </label>
        <div class="flex items-center gap-2">
          <button type="button"
                  @click="prevPage"
                  :disabled="effectivePage <= 1"
                  :aria-disabled="effectivePage <= 1"
                  aria-label="Previous page"
                  class="h-11 min-w-[44px] px-4 rounded-md border border-slate-300 text-navy-900 hover:bg-slate-50 focus-ring disabled:text-slate-300 disabled:border-slate-200 disabled:cursor-not-allowed disabled:hover:bg-transparent">
            Prev
          </button>
          <span class="text-slate-700 px-2 tabular-nums">Page {{ effectivePage }} of {{ totalPages }}</span>
          <button type="button"
                  @click="nextPage"
                  :disabled="effectivePage >= totalPages"
                  :aria-disabled="effectivePage >= totalPages"
                  aria-label="Next page"
                  class="h-11 min-w-[44px] px-4 rounded-md border border-slate-300 text-navy-900 hover:bg-slate-50 focus-ring disabled:text-slate-300 disabled:border-slate-200 disabled:cursor-not-allowed disabled:hover:bg-transparent">
            Next
          </button>
        </div>
      </div>
      <span aria-live="polite" class="sr-only">Page {{ effectivePage }} of {{ totalPages }}, showing orders {{ rangeStart }} to {{ rangeEnd }}.</span>
    </nav>
  </div>`
};

/* ---------- Page: Order Detail ---------------------------------------------- */

const OrderDetailPage = {
  components:{ Icon, StatusBadge, MessagesPanel },
  data(){ return {
    tabs: ['overview','messages','timeline'],
    attSearch: '',
    attSort: { by:'uploaded', dir:'desc' },
    attPage: 1,
    attPageSize: 25,
  }; },
  watch:{
    attSearch(){ this.attPage = 1; },
    attPageSize(){ this.attPage = 1; },
  },
  computed:{
    state(){ return state; },
    order(){ return state.orders.find(o => o.id === this.$route.params.id); },
    orderFacility(){
      return this.order ? FACILITIES.find(f => f.code === this.order.facility) : null;
    },
    inScope(){
      return !!this.order && this.order.facility === state.profile.currentFacility;
    },
    treatmentLabels(){ return TREATMENT_LABELS; },
    treatmentStyles(){ return TREATMENT_STYLES; },
    canEdit(){ return this.order && !['Completed','Cancelled'].includes(this.order.status); },
    currentTab(){
      let t = this.$route.query.tab;
      // Backward-compat: ?tab=conversation → messages; ?tab=activity → timeline; ?tab=attachments → overview.
      if (t === 'conversation') t = 'messages';
      if (t === 'activity') t = 'timeline';
      if (t === 'attachments') t = 'overview';
      return this.tabs.includes(t) ? t : 'overview';
    },
    messageCount(){ return this.order ? (state.messages[this.order.id] || []).length : 0; },
    attachments(){
      if (!this.order) return [];
      const facName = this.orderFacility ? `Steritech ${this.orderFacility.name}` : 'Steritech';
      const customer = state.profile.contact || 'Customer';
      const sub = this.order.submitted;
      const col = this.order.collection;
      return [
        { name: `msds-${this.order.formCode.toLowerCase()}.pdf`,         type:'PDF', size:'184 KB', uploaded: sub, uploadedBy: customer },
        { name: `coa-${this.order.id.toLowerCase()}.pdf`,                type:'PDF', size:'92 KB',  uploaded: sub, uploadedBy: customer },
        { name: `dose-map-${this.order.id.toLowerCase()}.pdf`,           type:'PDF', size:'412 KB', uploaded: col, uploadedBy: facName  },
        { name: `treatment-cert-${this.order.id.toLowerCase()}.pdf`,     type:'PDF', size:'128 KB', uploaded: col, uploadedBy: facName  },
        { name: `iso-11137-evidence-${this.order.id.toLowerCase()}.pdf`, type:'PDF', size:'276 KB', uploaded: col, uploadedBy: facName  },
        { name: `batch-log-${this.order.id.toLowerCase()}.csv`,          type:'CSV', size:'18 KB',  uploaded: col, uploadedBy: facName  },
      ];
    },
    attachmentCount(){ return this.attachments.length; },
    filteredAttachments(){
      if (!this.attSearch.trim()) return this.attachments;
      const q = this.attSearch.toLowerCase();
      return this.attachments.filter(f =>
        f.name.toLowerCase().includes(q) ||
        f.type.toLowerCase().includes(q) ||
        f.uploadedBy.toLowerCase().includes(q));
    },
    sortedAttachments(){
      const list = this.filteredAttachments.slice();
      const k = this.attSort.by;
      const m = this.attSort.dir === 'asc' ? 1 : -1;
      list.sort((a,b) => (a[k] > b[k] ? m : a[k] < b[k] ? -m : 0));
      return list;
    },
    attTotalPages(){ return Math.max(1, Math.ceil(this.sortedAttachments.length / this.attPageSize)); },
    attEffectivePage(){ return Math.min(this.attPage, this.attTotalPages); },
    pagedAttachments(){
      if (this.sortedAttachments.length <= this.attPageSize) return this.sortedAttachments;
      const start = (this.attEffectivePage - 1) * this.attPageSize;
      return this.sortedAttachments.slice(start, start + this.attPageSize);
    },
    attRangeStart(){ return this.sortedAttachments.length === 0 ? 0 : (this.attEffectivePage - 1) * this.attPageSize + 1; },
    attRangeEnd(){ return Math.min(this.attEffectivePage * this.attPageSize, this.sortedAttachments.length); },
    timeline(){
      if (!this.order) return [];
      const e = [
        { ts: this.order.submitted + 'T09:12', label:'Submitted via portal', icon:'upload', done:true },
        { ts: this.order.submitted + 'T09:12', label:'Exsited order created · ' + this.order.exsitedId, icon:'receipt', done:true },
      ];
      if (this.order.bcSync === 'pending')  e.push({ ts:this.order.submitted+'T09:14', label:'Business Central sync queued', icon:'clock', done:false });
      if (this.order.bcSync === 'syncing')  e.push({ ts:this.order.submitted+'T09:14', label:'Business Central sync in progress', icon:'refresh-cw', done:false, pulse:true });
      if (this.order.bcSync === 'failed')   e.push({ ts:this.order.submitted+'T09:18', label:'BC sync failed — will retry', icon:'x-circle', done:false, fail:true });
      if (this.order.bcSync === 'dead')     e.push({ ts:this.order.submitted+'T09:40', label:'BC sync moved to dead-letter queue', icon:'alert-octagon', done:false, fail:true });
      // Map new domain statuses to timeline milestones.
      // Cancelled is a terminal branch and produces no in-process events.
      if (['Accepted','Scheduled for Processing','In Process','Ready for Invoicing','Completed','Late Arrival','On Hold'].includes(this.order.status))
        e.push({ ts: this.order.collection+'T06:00', label:'Accepted by facility', icon:'check-circle', done:true });
      if (this.order.status === 'On Hold')
        e.push({ ts: this.order.collection+'T07:00', label:'Order placed on hold', icon:'pause-circle', done:false });
      if (this.order.status === 'Late Arrival')
        e.push({ ts: this.order.collection+'T07:30', label:'Arrival flagged late', icon:'alert-triangle', done:false });
      if (['Scheduled for Processing','In Process','Ready for Invoicing','Completed'].includes(this.order.status))
        e.push({ ts: this.order.collection+'T08:30', label:'Scheduled for processing', icon:'calendar', done:true });
      if (['In Process','Ready for Invoicing','Completed'].includes(this.order.status))
        e.push({ ts: this.order.collection+'T11:30', label:'Treatment in process', icon:'radiation', done:true, pulse: this.order.status === 'In Process' });
      if (['Ready for Invoicing','Completed'].includes(this.order.status))
        e.push({ ts: this.order.collection+'T15:00', label:'Ready for invoicing', icon:'receipt', done:true });
      if (this.order.status === 'Completed')
        e.push({ ts: this.order.collection+'T16:00', label:'Completed and released to consignee', icon:'badge-check', done:true });
      if (this.order.status === 'Cancelled')
        e.push({ ts: this.order.collection+'T08:00', label:'Order cancelled', icon:'x-circle', done:false, fail:true });
      return e;
    }
  },
  methods:{
    fmtDate, fmtMoney,
    dotClass(e){
      if (e.fail) return 'bg-red-500';
      if (e.pulse) return 'bg-amber-500 animate-syncpulse';
      if (e.done) return 'bg-emerald-500';
      return 'bg-slate-300';
    },
    selectTab(t){
      const next = t === 'overview' ? null : t;
      const q = { ...this.$route.query };
      if (next) q.tab = next; else delete q.tab;
      this.$router.replace({ query: q });
    },
    tabLabel(t){
      return ({ overview:'Overview', messages:'Messages', timeline:'Timeline' })[t] || t;
    },
    setAttSort(by){
      if (this.attSort.by === by) this.attSort.dir = this.attSort.dir === 'asc' ? 'desc' : 'asc';
      else { this.attSort.by = by; this.attSort.dir = 'asc'; }
    },
    attSortIcon(by){
      return this.attSort.by === by ? (this.attSort.dir === 'asc' ? 'chevron-up' : 'chevron-down') : 'chevrons-up-down';
    },
    attPrevPage(){ if (this.attEffectivePage > 1) this.attPage = this.attEffectivePage - 1; },
    attNextPage(){ if (this.attEffectivePage < this.attTotalPages) this.attPage = this.attEffectivePage + 1; },
    typeBadgeClass(type){
      return ({
        'PDF':  'bg-red-50 text-red-700 border-red-200',
        'CSV':  'bg-emerald-50 text-emerald-700 border-emerald-200',
        'DOCX': 'bg-blue-50 text-blue-700 border-blue-200',
        'XLSX': 'bg-green-50 text-green-700 border-green-200',
        'PNG':  'bg-violet-50 text-violet-700 border-violet-200',
        'JPG':  'bg-violet-50 text-violet-700 border-violet-200',
        'ZIP':  'bg-amber-50 text-amber-700 border-amber-200',
      })[type] || 'bg-slate-50 text-slate-700 border-slate-200';
    },
    typeIconName(type){
      return ({
        'PDF':'file-text', 'CSV':'file-spreadsheet', 'XLSX':'file-spreadsheet',
        'DOCX':'file-text', 'PNG':'image', 'JPG':'image', 'ZIP':'archive'
      })[type] || 'file';
    },
    typeIconClass(type){
      return ({
        'PDF':'text-red-500', 'CSV':'text-emerald-500', 'XLSX':'text-green-500',
        'DOCX':'text-blue-500', 'PNG':'text-violet-500', 'JPG':'text-violet-500',
        'ZIP':'text-amber-500'
      })[type] || 'text-slate-500';
    }
  },
  template:`
  <div v-if="!order" class="p-12 text-slate-500">Order not found.</div>
  <div v-else class="p-6 sm:p-8 max-w-full space-y-6 text-base text-slate-800">

      <router-link to="/orders" class="inline-flex items-center gap-1 mt-4 text-sm text-teal-600 hover:underline focus-ring rounded">

    </div>

    <template v-else>
      <!-- Header strip: title, persistent status line, plain-text actions -->
      <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-4">

                  @click="selectTab(t)"

      <!-- Overview pane -->

            <div class="p-5 space-y-4">

const SiteSettingsPage = {
  components:{ Icon, Btn },
  data(){
    const m = state.maintenanceBanner;
    return {
      // Local draft so the user can preview/edit before saving
      enabled:  m.enabled,
      message:  m.message,
      severity: m.severity,
    };
  },
  computed:{
    state(){ return state; },
    isDirty(){
      const m = state.maintenanceBanner;
      return this.enabled !== m.enabled || this.message !== m.message || this.severity !== m.severity;
    },
    previewPalette(){
      if (this.severity === 'critical') return { bg:'bg-rose-50', border:'border-rose-300', text:'text-rose-900', accent:'text-rose-700', icon:'alert-octagon', label:'Critical' };
      if (this.severity === 'warning')  return { bg:'bg-amber-50', border:'border-amber-300', text:'text-amber-900', accent:'text-amber-700', icon:'alert-triangle', label:'Warning' };
      return                                   { bg:'bg-sky-50',   border:'border-sky-300',   text:'text-sky-900',   accent:'text-sky-700',   icon:'info', label:'Info' };
    },
    charCount(){ return this.message.length; },
    charLimit(){ return 200; },
  },
  methods:{
    save(){
      if (!this.message.trim()) {
        showToast('Message cannot be empty.', 'error');
        return;
      }
      state.maintenanceBanner = {
        enabled: this.enabled,
        message: this.message.trim(),
        severity: this.severity,
      };
      showToast(this.enabled ? 'Maintenance banner published.' : 'Settings saved.','success');
    },
    revert(){
      const m = state.maintenanceBanner;
      this.enabled  = m.enabled;
      this.message  = m.message;
      this.severity = m.severity;
    },
    quickToggle(){
      // Publish the on/off flip immediately without requiring a Save click
      this.enabled = !this.enabled;
      state.maintenanceBanner = {
        enabled: this.enabled,
        message: this.message.trim() || state.maintenanceBanner.message,
        severity: this.severity,
      };
      showToast(this.enabled ? 'Banner is now visible to all users.' : 'Banner hidden.','success');
    },
  },

/* ---------- Phase 4a: Field component library ------------------------------ */

const FieldWrap = {
  props:['label','required','error','help','forId'],
  template:`
    <div>
      <label v-if="label" :for="forId" class="block text-xs font-medium text-slate-700 mb-1.5">
        {{ label }} <span v-if="required" class="text-red-500">*</span>
      </label>
      <slot/>
      <div v-if="error" class="mt-1 text-xs text-red-600 flex items-center gap-1"><span>⚠</span>{{ error }}</div>
      <div v-else-if="help" class="mt-1 text-[11px] text-slate-500">{{ help }}</div>
    </div>`
};
function fieldInputCls(err, readonly){
  const base = 'w-full rounded-lg border px-3 py-2 text-sm focus-ring';
  if (err) return base + ' border-red-400 bg-red-50/40';
  if (readonly) return base + ' border-slate-200 bg-slate-50 text-slate-500';
  return base + ' border-slate-300';
}
const genUid = (() => { let n=0; return () => 'f'+(++n); })();

const FieldText = {
  props:['label','modelValue','required','error','readonly','help','placeholder'],
  emits:['update:modelValue'],
  data(){ return { uid: genUid() }; },
  components:{ FieldWrap },
  template:`<FieldWrap :label="label" :required="required" :error="error" :help="help" :forId="uid">
    <input :id="uid" type="text" :value="modelValue" :readonly="readonly" :placeholder="placeholder"
           @input="$emit('update:modelValue', $event.target.value)"
           :class="cls"/>
  </FieldWrap>`,
  computed:{ cls(){ return fieldInputCls(this.error, this.readonly); } }
};
const FieldTextarea = {
  props:['label','modelValue','required','error','readonly','help','rows','placeholder'],
  emits:['update:modelValue'],
  data(){ return { uid: genUid() }; },
  components:{ FieldWrap },
  template:`<FieldWrap :label="label" :required="required" :error="error" :help="help" :forId="uid">
    <textarea :id="uid" :value="modelValue" :readonly="readonly" :rows="rows || 3" :placeholder="placeholder"
              @input="$emit('update:modelValue', $event.target.value)"
              :class="cls"></textarea>
  </FieldWrap>`,
  computed:{ cls(){ return fieldInputCls(this.error, this.readonly); } }
};
const FieldEmail = {
  props:['label','modelValue','required','error','readonly','help','placeholder'],
  emits:['update:modelValue'],
  data(){ return { uid: genUid() }; },
  components:{ FieldWrap },
  template:`<FieldWrap :label="label" :required="required" :error="error" :help="help" :forId="uid">
    <input :id="uid" type="email" :value="modelValue" :readonly="readonly" :placeholder="placeholder||'name@company.com.au'"
           @input="$emit('update:modelValue', $event.target.value)" :class="cls"/>
  </FieldWrap>`,
  computed:{ cls(){ return fieldInputCls(this.error, this.readonly); } }
};
const FieldPhone = {
  props:['label','modelValue','required','error','readonly','help','placeholder'],
  emits:['update:modelValue'],
  data(){ return { uid: genUid() }; },
  components:{ FieldWrap },

const FieldSignature = {
  props:['label','modelValue','required','error','readonly','help'],
  emits:['update:modelValue'],
  data(){ return { drawing:false, last:null }; },
  components:{ FieldWrap },
  mounted(){
    const ctx = this.$refs.c.getContext('2d');
    ctx.lineWidth = 2; ctx.lineCap='round'; ctx.strokeStyle = '#0F2A44';
    if (this.modelValue){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0); img.src=this.modelValue; }
  },
  methods:{
    pos(e){ const r=this.$refs.c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return [t.clientX-r.left, t.clientY-r.top]; },
    start(e){ if (this.readonly) return; e.preventDefault(); this.drawing=true; this.last=this.pos(e); },
    move(e){ if (!this.drawing) return; e.preventDefault();
      const [x,y]=this.pos(e); const ctx=this.$refs.c.getContext('2d');
      ctx.beginPath(); ctx.moveTo(this.last[0],this.last[1]); ctx.lineTo(x,y); ctx.stroke(); this.last=[x,y]; },
    end(){ if (!this.drawing) return; this.drawing=false; this.$emit('update:modelValue', this.$refs.c.toDataURL('image/png')); },
    clear(){ const c=this.$refs.c; c.getContext('2d').clearRect(0,0,c.width,c.height); this.$emit('update:modelValue',''); }
  },
  template:`<FieldWrap :label="label" :required="required" :error="error" :help="help">
    <div :class="['border rounded-lg overflow-hidden bg-white sig-pad',
                  error ? 'border-red-400' : 'border-slate-300',
                  readonly && 'opacity-60']">
      <canvas ref="c" width="560" height="120" class="block w-full touch-none cursor-crosshair"
              @mousedown="start" @mousemove="move" @mouseup="end" @mouseleave="end"
              @touchstart="start" @touchmove="move" @touchend="end"></canvas>
    </div>
    <div class="flex items-center justify-between mt-1">
      <div class="text-[11px] text-slate-500">Sign with mouse or finger</div>
      <button v-if="!readonly" type="button" @click="clear" class="text-[11px] text-slate-600 hover:text-red-600">Clear</button>
    </div>
  </FieldWrap>`
};
const FieldCalculated = {
  props:['label','modelValue','required','error','help','formula'],
  components:{ FieldWrap },
  template:`<FieldWrap :label="label" :required="required" :error="error" :help="help">

  data(){
    // Build empty access matrix: { MER: { Gamma:false, ETO:false, GMP:false }, ... }
    const access = {};
    FACILITIES.forEach(f => {
      const row = {};
      TREATMENT_SERVICES.forEach(s => { row[s] = false; });
      access[f.code] = row;
    });
    return {
      step: 1,
      f: {
        company:'',
        contact:'',
        abn:'',
        phone:'',
        email:'',
        addrStreet:'',
        addrSuburb:'',
        addrState:'VIC',
        addrPostcode:'',
      },
      access,
      previewOpen: false,
    };
  },
  computed:{
    state(){ return state; },
    facilities(){ return FACILITIES; },
    services(){ return TREATMENT_SERVICES; },
    /* For each facility row, which services CAN be ticked (offered there) */
    canCheck(){
      const m = {};
      FACILITIES.forEach(f => {
        const row = {};
        TREATMENT_SERVICES.forEach(s => { row[s] = f.services.includes(s); });
        m[f.code] = row;
      });
      return m;
    },
    /* List of facilities the customer will have access to (any service ticked in their row) */
    grantedFacilities(){
      return FACILITIES.filter(f => TREATMENT_SERVICES.some(s => this.access[f.code][s]));
    },
    /* Forms preview rows — re-uses form-picker grouping. Shared forms collapse to one row with combined badges. */
    previewRows(){
      const granted = new Set(this.grantedFacilities.map(f => f.code));
      const grantedTreatments = {};
      this.grantedFacilities.forEach(f => {
        grantedTreatments[f.code] = TREATMENT_SERVICES.filter(s => this.access[f.code][s]);
      });
      const rows = [];
      const sharedSeen = new Set();
      for (const fm of FORM_CATALOG) {
        if (!granted.has(fm.facility)) continue;
        // Treatment gating: form's treatment must be allowed for this facility
        // Special-case 'Gamma+ETO' — needs either Gamma or ETO at the facility
        const allowedTreats = grantedTreatments[fm.facility] || [];
        const treats = fm.treatment === 'Gamma+ETO' ? ['Gamma','ETO'] : [fm.treatment];
        const ok = treats.some(t => allowedTreats.includes(t));
        if (!ok) continue;

        const sharedWith = fm.shared_with || [];
        if (sharedWith.length) {
          // Dedup shared forms — collapse to one row with badges from intersection of shared_with & granted
          const key = `${fm.code}::${fm.key}`;
          if (sharedSeen.has(key)) continue;
          sharedSeen.add(key);
          const badges = sharedWith.filter(c => granted.has(c));
          rows.push({ code: fm.code, name: fm.name, treatment: fm.treatment, badges, isShared:true, key });
        } else {
          rows.push({ code: fm.code, name: fm.name, treatment: fm.treatment, badges:[fm.facility], isShared:false, key:`${fm.facility}::${fm.code}` });
        }
      }
      // Group by treatment for the picker layout
      const groups = {};
      rows.forEach(r => {
        const t = r.treatment;
        if (!groups[t]) groups[t] = [];
        groups[t].push(r);
      });
      const order = ['Gamma','ETO','GMP','Gamma+ETO'];
      return order.filter(t => groups[t]).map(t => ({ treatment:t, rows: groups[t] }));
    },
    step1Valid(){
      const f = this.f;
      return f.company.trim() && f.contact.trim() && f.abn.trim() && f.phone.trim() && f.email.trim()
          && f.addrStreet.trim() && f.addrSuburb.trim() && f.addrState && f.addrPostcode.trim();
    },
    step2Valid(){
      return this.grantedFacilities.length > 0;
    },
  },

      // never drift apart. Add `border` for the table-header pill outline.
      const s = TREATMENT_STYLES[t] || TREATMENT_STYLES['Gamma'];

    next(){ if (this.step1Valid) this.step = 2; },
    back(){ this.step = 1; },
    cancel(){ this.$router.push('/dashboard'); },

const CustomerListPage = {
  components:{ Icon, Btn },
  data(){ return {
    facilityFilter:'All', statusFilter:'All', q:'',
    menuFor:null,            // customer.id whose actions menu is open
    editing:null,            // working draft for the Edit modal: { ...customer fields, accessMatrix }
    confirmDeactivate:null,  // customer object pending deactivation confirmation
  }; },
  mounted(){ document.addEventListener('click', this.closeMenu); },
  beforeUnmount(){ document.removeEventListener('click', this.closeMenu); },
  computed:{
    state(){ return state; },
    facilities(){ return FACILITIES; },
    rows(){
      const q = this.q.trim().toLowerCase();
      return state.customers.filter(c => {
        if (this.facilityFilter !== 'All' && !c.facilities.includes(this.facilityFilter)) return false;
        if (this.statusFilter !== 'All' && c.status !== this.statusFilter) return false;
        if (q) {
          const blob = (c.contact + ' ' + c.company + ' ' + c.email).toLowerCase();
          if (!blob.includes(q)) return false;
        }
        return true;
      });
    },
    activeCount(){ return state.customers.filter(c => c.status === 'Active').length; },
    pendingCount(){ return state.customers.filter(c => c.status === 'Pending').length; },
    disabledCount(){ return state.customers.filter(c => c.status === 'Disabled').length; },
    totalCount(){ return state.customers.length; },
    facilityUsage(){
      // Count how many active customers are using each facility
      const counts = {};
      FACILITIES.forEach(f => counts[f.code] = 0);
      state.customers.forEach(c => {
        if (c.status !== 'Active') return;
        c.facilities.forEach(code => { if (counts[code] !== undefined) counts[code]++; });
      });
      return FACILITIES.map(f => ({ code: f.code, name: f.name, count: counts[f.code] }));
    },
  },
  methods:{
    fmtDate,
    statusCls(s){
      if (s === 'Active')   return 'bg-emerald-100 text-emerald-800 ring-emerald-200';
      if (s === 'Pending')  return 'bg-amber-100   text-amber-800   ring-amber-200';
      if (s === 'Disabled') return 'bg-slate-100   text-slate-600   ring-slate-200';
      return 'bg-slate-100 text-slate-700 ring-slate-200';
    },
    closeMenu(){ this.menuFor = null; },
    toggleMenu(c, ev){
      ev.stopPropagation();
      this.menuFor = (this.menuFor === c.id) ? null : c.id;
    },

    /* ---- Edit details ---- */
    openEdit(c, ev){
      if (ev) ev.stopPropagation();
      this.menuFor = null;
      // Build access matrix from customer's current facility+service combo.
      // Customer model only stores flat lists (facilities[], services[]); we expand to a matrix
      // intersected with each facility's offered services so the matrix reflects what's actually possible.
      const access = {};
      FACILITIES.forEach(f => {
        const row = {};
        TREATMENT_SERVICES.forEach(s => {
          row[s] = c.facilities.includes(f.code) && c.services.includes(s) && f.services.includes(s);
        });
        access[f.code] = row;
      });
      this.editing = {
        id: c.id,
        company: c.company,
        contact: c.contact,
        email: c.email,
        phone: c.phone || '',
        access,
      };
    },
    closeEdit(){ this.editing = null; },
    canCheckAt(facCode, service){
      const f = FACILITIES.find(x => x.code === facCode);
      return !!(f && f.services.includes(service));
    },
    saveEdit(){
      const e = this.editing;
      if (!e.company.trim() || !e.contact.trim() || !e.email.trim()) {
        showToast('Company, contact and email are required.', 'error');
        return;
      }
      const c = state.customers.find(x => x.id === e.id);
      if (!c) { this.editing = null; return; }
      // Collapse access matrix back into flat facility/service lists
      const facilities = [];
      const servicesSet = new Set();
      FACILITIES.forEach(f => {
        const row = e.access[f.code];
        const any = TREATMENT_SERVICES.some(s => row[s]);
        if (any) {
          facilities.push(f.code);
          TREATMENT_SERVICES.forEach(s => { if (row[s]) servicesSet.add(s); });
        }
      });
      c.company = e.company.trim();
      c.contact = e.contact.trim();
      c.email   = e.email.trim();
      c.phone   = e.phone.trim();
      c.facilities = facilities;
      c.services   = Array.from(servicesSet);
      this.editing = null;
      showToast('Customer details updated.', 'success');
    },

    /* ---- Deactivate / Reactivate ---- */
    askDeactivate(c, ev){
      if (ev) ev.stopPropagation();
      this.menuFor = null;
      this.confirmDeactivate = c;
    },
    cancelDeactivate(){ this.confirmDeactivate = null; },

      const target = state.customers.find(x => x.id === c.id);
      if (target) target.status = 'Disabled';
      this.confirmDeactivate = null;
      showToast(`${c.company} has been deactivated.`, 'success');
    },
    reactivate(c, ev){
      if (ev) ev.stopPropagation();
      this.menuFor = null;
      const target = state.customers.find(x => x.id === c.id);
      if (target) target.status = 'Active';
      showToast(`${c.company} has been reactivated.`, 'success');
    },

    messageThreads(){
      return state.orders.slice(0, 5).map(o => ({
        order: o,
        msgs: state.messages[o.id] || [],
      })).sort((a,b) => {
        // Threads with messages first, then by latest message ts desc
        const aHas = a.msgs.length > 0, bHas = b.msgs.length > 0;
        if (aHas !== bHas) return bHas - aHas;
        const aLast = a.msgs.length ? a.msgs[a.msgs.length-1].ts : a.order.submitted;
        const bLast = b.msgs.length ? b.msgs[b.msgs.length-1].ts : b.order.submitted;
        return bLast.localeCompare(aLast);
      });
    },
    totalMessageCount(){
      return this.messageThreads.reduce((n,t) => n + t.msgs.length, 0);

    activeThreadCount(){
      return this.messageThreads.filter(t => t.msgs.length > 0).length;

const SchemaEditorPage = {
  components:{ Icon, Btn, TreatmentChip },
  data(){
    // Build per-row schema state: collapse shared rows to a single canonical entry.
    // Key = sharedKey (groups MER+NAR FRM-0359 into one) | facility+key for exclusives.
    const rows = [];
    const seenShared = new Set();
    for (const fm of FORM_CATALOG) {
      const isShared = (fm.shared_with || []).length >= 2;
      const sharedKey = isShared ? `SHARED:${fm.code}` : `${fm.facility}:${fm.key}`;
      if (isShared && seenShared.has(fm.code)) continue;
      if (isShared) seenShared.add(fm.code);
      rows.push({
        id: sharedKey,
        code: fm.code,
        name: fm.name,
        treatment: fm.treatment,
        // Facilities for badge: shared rows show all sharing facilities; exclusive shows just one.
        facilities: isShared ? [...fm.shared_with] : [fm.facility],
        // The "current facility" context for fork copy purposes — first facility
        currentFacility: fm.facility,
        shared: isShared,
        version: 3,
        forkedFrom: null,           // { facility, version } once forked
        // Mock JSON body for the editor
        json: this._buildMockJson(fm),
      });
    }
    return {
      rows,
      selectedId: null,
      forkPrompt: null,             // { schemaId } — pops the modal
    };
  },
  computed:{
    state(){ return state; },
    grouped(){
      const groups = { 'Gamma':[], 'ETO':[], 'GMP':[], 'Gamma+ETO':[] };
      for (const r of this.rows) {
        if (groups[r.treatment]) groups[r.treatment].push(r);
        else groups[r.treatment] = [r];
      }
      return groups;
    },
    selected(){ return this.rows.find(r => r.id === this.selectedId) || null; },
    sharingFacilityNames(){
      if (!this.selected || !this.selected.shared) return '';
      return this.selected.facilities
        .map(code => FACILITIES.find(f => f.code === code))
        .filter(Boolean)
        .map(f => f.name)
        .join(', ');
    },
    otherFacilityNames(){
      if (!this.selected || !this.selected.shared) return '';
      return this.selected.facilities
        .filter(code => code !== this.selected.currentFacility)
        .map(code => FACILITIES.find(f => f.code === code)?.name)
        .filter(Boolean)
        .join(', ');
    },
    lineNumbers(){
      if (!this.selected) return [];
      const n = (this.selected.json.match(/\n/g) || []).length + 1;
      return Array.from({length:n}, (_,i)=> i+1);
    },
  },
  methods:{
    _buildMockJson(fm){
      const obj = {
        code: fm.code,
        name: fm.name,
        treatment: fm.treatment,
        facility: fm.facility,
        shared_with: fm.shared_with || [],
        sections: [
          { id:'about-you',     title:'About You' },
          { id:'consignment',   title:'Consignment Details' },
          { id:'params',        title:`${fm.treatment} Parameters` },
          { id:'declaration',   title:'Declaration & Sign-off' },
        ],
      };
      return JSON.stringify(obj, null, 2);
    },
    facName(code){ return FACILITIES.find(f => f.code === code)?.name || code; },
    pick(id){ this.selectedId = id; },
    saveClicked(){
      const s = this.selected;
      if (!s) return;
      if (s.shared) {
        this.forkPrompt = { schemaId: s.id };
      } else {
        s.version += 1;
        showToast('Schema updated.','success');
      }
    },
    applyToAll(){
      const s = this.selected;
      s.version += 1;
      const n = s.facilities.length;
      showToast(`Schema updated for ${n} ${n === 1 ? 'facility' : 'facilities'}.`,'success');
      this.forkPrompt = null;
    },
    forkOnly(){
      const s = this.selected;
      const facName  = this.facName(s.currentFacility);
      const others   = this.otherFacilityNames;
      s.forkedFrom = { facility:s.currentFacility, version:s.version };
      // Bump version on the forked copy
      s.version += 1;
      // Mark schema no longer shared (this fork is now its own)
      s.shared = false;
      s.facilities = [s.currentFacility];
      showToast(`Forked schema for ${facName}. ${others} continue on the previous version.`,'success');
      this.forkPrompt = null;
    },
    cancelFork(){ this.forkPrompt = null; },
  },

          <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full overflow-hidden" role="dialog" aria-modal="true">
            <div class="px-6 pt-6 pb-2 flex items-start gap-3">
              <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center shrink-0">
                <Icon name="git-branch" :size="18"/>
              </div>
              <div class="flex-1">
                <h2 class="text-base font-semibold text-navy-900">Apply changes to all sharing facilities?</h2>
                <p class="text-xs text-slate-500 mt-0.5">{{ selected.code }} · {{ selected.name }}</p>
              </div>
            </div>
            <div class="px-6 py-4 text-sm text-slate-700 leading-relaxed">
              This form is shared by <strong class="text-navy-900">{{ sharingFacilityNames }}</strong>.
              Choose to update all or fork only this facility.
            </div>
            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex flex-wrap items-center justify-end gap-2">
              <Btn kind="ghost" @click="cancelFork">Cancel</Btn>
              <Btn kind="outline" icon="git-branch" @click="forkOnly">Fork {{ facName(selected.currentFacility) }}</Btn>
              <Btn kind="primary" icon="check" @click="applyToAll">Apply to all</Btn>
            </div>
          </div>
        </div>
      </div>
    </div>
  `
};

/* ---------- Router ---------------------------------------------------------- */
const requireAuth = (to, from, next) => { if (state.authed) next(); else next('/login'); };
const requireFacilities = (to, from, next) => {
  if ((state.profile.facilities || []).length === 0) next('/onboarding/incomplete');
  else next();
};
const requireAdmin = (to, from, next) => {
  if (state.role === 'admin') next();
  else next('/dashboard');
};

const router = createRouter({
  history: createWebHashHistory(),
  routes: [
    { path:'/login',    component: LoginPage },
    { path:'/signup',   component: SignupPage },
    { path:'/onboarding/incomplete', component: OnboardingIncompletePage },
    { path:'/',          component: Shell, beforeEnter: requireAuth,
      children: [
        { path:'',                                  redirect:'/dashboard' },
        { path:'/dashboard',                        component: DashboardPage, beforeEnter: requireFacilities },
        { path:'/start',                            component: StartRequestPage, beforeEnter: requireFacilities },
        { path:'/forms',                            component: FormPickerPage, beforeEnter: requireFacilities },
        { path:'/forms/:facility/:formKey',         component: FormRenderer },
        { path:'/orders',                           component: OrdersPage },
        { path:'/orders/:id',                       component: OrderDetailPage },
        { path:'/submitted/:id',                    component: SubmittedPage },
        { path:'/settings',                         component: SettingsPage },
        { path:'/admin',                            component: AdminConsolePage,    beforeEnter: requireAdmin },
        { path:'/admin/customers',                  component: CustomerListPage,    beforeEnter: requireAdmin },
        { path:'/admin/customers/:id',              component: CustomerDetailPage,  beforeEnter: requireAdmin },
        { path:'/admin/onboard-customer',           component: OnboardCustomerPage, beforeEnter: requireAdmin },
        { path:'/admin/site-settings',              redirect: { path:'/settings', query:{ tab:'site' } } },
        { path:'/_dev/fields',                      component: DevFieldsPage },
      ]
    },
    { path: '/:pathMatch(.*)*', redirect:'/dashboard' }
  ]
});

/* ---------- Boot ------------------------------------------------------------ */

// start authed for the wireframe so the user lands on the app
state.authed = true;

const app = createApp({});
// Click-outside directive (used by mid-form facility menu, etc.)
app.directive('click-outside', {
  beforeMount(el, binding) {
    el.__clickOutsideHandler__ = (event) => {
      if (!(el === event.target || el.contains(event.target))) {
        binding.value(event);
      }
    };
    setTimeout(() => document.addEventListener('click', el.__clickOutsideHandler__), 0);
  },
  unmounted(el) {
    document.removeEventListener('click', el.__clickOutsideHandler__);
    delete el.__clickOutsideHandler__;
  }
});
app.component('Icon', Icon);
app.component('Btn', Btn);
app.component('TreatmentChip', TreatmentChip);
app.component('BcSyncChip', BcSyncChip);
app.component('StatusBadge', StatusBadge);
app.component('TopNav', TopNav);
app.component('Sidebar', Sidebar);
app.component('FacilityChip', FacilityChip);
app.component('DemoPanel', DemoPanel);
app.component('FacilitySwitcher', FacilitySwitcher);
app.component('Shell', Shell);
app.component('EmptyState', EmptyState);
app.component('Skel', Skel);
app.component('FileUploadField', FileUploadField);
app.component('SignaturePad', SignaturePad);
// Phase 4a field component library
app.component('FieldText',       FieldText);
app.component('FieldTextarea',   FieldTextarea);
app.component('FieldEmail',      FieldEmail);
app.component('FieldPhone',      FieldPhone);
app.component('FieldNumber',     FieldNumber);
app.component('FieldDate',       FieldDate);
app.component('FieldRadio',      FieldRadio);
app.component('FieldCheckbox',   FieldCheckbox);
app.component('FieldSelect',     FieldSelect);
app.component('FieldFileUpload', FieldFileUpload);
app.component('FieldSignature',  FieldSignature);
app.component('FieldCalculated', FieldCalculated);
app.use(router);
app.mount('#app');
window.__state = state;

/* Re-render Lucide icons whenever the route changes */
router.afterEach(() => {
  nextTick(() => window.lucide?.createIcons());
});
</script>
</body>
</html>
