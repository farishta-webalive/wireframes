  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ity logic for that pick.\n    */\n    pickerRows(){\n      const facCode = this.activeFacilityCode; // null = ALL (multi-user union view)\n      const boundSet = new Set(state.profile.facilities);\n      const rows = [];\n      const sharedSeen = new Set(); // dedupe shared forms by code+key\n\n      for (const f of FORM_CATALOG) {\n        const sharedWith = (f.shared_with && f.shared_with.length) ? f.shared_with : null;\n\n        if (sharedWith) {\n          const dedupeKey = `${f.code}|${f.key}`;\n          if (sharedSeen.has(dedupeKey)) continue;\n\n          if (facCode) {\n            // Specific facility view — show only if facCode is in shared_with.\n            if (!sharedWith.includes(facCode)) continue;\n            sharedSeen.add(dedupeKey);\n            rows.push({\n              ...f,\n              facility: facCode,                     // route + Start button anchor\n              badges: sharedWith.slice(),\n              isShared: true,\n            });\n          } else {\n            // ALL view — show once if any of the user's bound facilities overlaps shared_with.\n            const overlaps = sharedWith.some(s => boundSet.has(s));\n            if (!overlaps) continue;\n            sharedSeen.add(dedupeKey);\n            // Anchor route to first bound facility that has the shared schema.\n            const anchor = sharedWith.find(s => boundSet.has(s)) || f.facility;\n            rows.push({\n              ...f,\n              facility: anchor,\n              badges: sharedWith.slice(),\n              isShared: true,\n            });\n          }\n        } else {\n          // Exclusive form — single badge for its own facility.\n          if (facCode) {\n            if (f.facility !== facCode) continue;\n          } else {\n            if (!boundSet.has(f.facility)) continue;\n          }\n          rows.push({ ...f, badges: [f.facility], isShared: false });\n        }\n      }\n\n      // Search filter\n      const q = this.q.trim().toLowerC ientY-r.top]; },\n    start(e){ e.preventDefault(); this.drawing=true; this.last=this.pos(e); },\n    move(e){\n      if (!this.drawing) return; e.preventDefault();\n      const [x,y] = this.pos(e); const ctx = this.$refs.canvas.getContext('2d');\n      ctx.beginPath(); ctx.moveTo(this.last[0], this.last[1]); ctx.lineTo(x,y); ctx.stroke();\n      this.last = [x,y]; this.has = true;\n    },\n    end(){ this.drawing=false; if (this.has) this.$emit('update:modelValue', this.$refs.canvas.toDataURL('image/png')); },\n    clear(){ const c=this.$refs.canvas; c.getContext('2d').clearRect(0,0,c.width,c.height); this.has=false; this.$emit('update:modelValue',''); }\n  },\n  template:`\n    <div>\n      <div class=\"border border-slate-300 rounded-lg overflow-hidden bg-white sig-pad\">\n        <canvas ref=\"canvas\" width=\"560\" height=\"120\" class=\"block w-full touch-none cursor-crosshair\"\n                @mousedown=\"start\" @mousemove=\"move\" @mouseup=\"end\" @mouseleave=\"end\"\n                @touchstart=\"start\" @touchmove=\"move\" @touchend=\"end\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div class=\"flex items-center justify-between mt-1\">\n        <div class=\"text-[11px] text-slate-500\">Sign with mouse or finger<\u002Fdiv>\n        <button @click=\"clear\" type=\"button\" class=\"text-[11px] text-slate-600 hover:text-red-600 inline-flex items-center gap-1\"><Icon name=\"eraser\" :size=\"12\"/>Clear<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`,\n  components:{ Icon }\n};\n\nconst FileUploadField = {\n  props:['modelValue','accept','label'],\n  emits:['update:modelValue'],\n  methods:{\n    onFile(e){\n      const f = e.target.files[0]; if (!f) return;\n      this.$emit('update:modelValue', { name:f.name, size:f.size, type:f.type });\n    },\n    clear(){ this.$emit('update:modelValue', null); }\n  },\n  template:`\n    <div>\n      <div v-if=\"!modelValue\" class=\"border-2 border-dashed border-slate-300 rounded-lg p-4 text-center hover:border-teal-5 \n        this.performMigration(targetCode, [], []);\n        return;\n      }\n      this.switchModal = { kind:'confirm', target:targetCode, targetName, delta, removed };\n    },\n    cancelSwitch(){ this.switchModal = null; },\n    confirmSwitch(){\n      if (!this.switchModal || this.switchModal.kind !== 'confirm') return;\n      const { target, delta, removed } = this.switchModal;\n      this.switchModal = null;\n      this.performMigration(target, delta, removed);\n    },\n    performMigration(targetCode, delta, removed){\n      // Snapshot current data; null `removed` keys; mark `delta` as forced-required for next submit.\n      const snapshot = JSON.parse(JSON.stringify(this.data || {}));\n      for (const k of removed) snapshot[k] = null;\n      this.pendingMigration = {\n        sourceData: snapshot,\n        delta: [...delta],\n      };\n      const formKey = this.route.params.formKey;\n      this.$router.push(`/forms/${targetCode}/${formKey}`);\n    },\n  },\n  mounted(){\n    if (!this.layoutOpts.single_scroll) {\n      this.$refs.scrollArea?.addEventListener('scroll', this.onScroll);\n    }\n  },\n  beforeUnmount(){\n    this.$refs.scrollArea?.removeEventListener('scroll', this.onScroll);\n  },\n  template:`\n  <div v-if=\"!schema\" class=\"p-8\">\n    <div class=\"bg-white border border-slate-200 rounded-lg p-8 max-w-lg\">\n      <Icon name=\"alert-triangle\" :size=\"28\" cls=\"text-amber-500 mb-2\"/>\n      <div class=\"font-semibold text-navy-900\">Form not found<\u002Fdiv>\n      <div class=\"text-sm text-slate-500 mt-1\">The form <code>{{ route.params.facility }}/{{ route.params.formKey }}<\u002Fcode> does not exist.<\u002Fdiv>\n      <Btn as=\"router-link\" :to=\"{ path:'/forms' }\" kind=\"secondary\" icon=\"arrow-left\" class=\"mt-4\">Back to forms<\u002FBtn>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div v-else ref=\"scrollArea\" class=\"flex h-[calc(100vh-3.5rem)]\">\n    <!-- Left: section stepper (sticky) -->\n    <div v-if=\"layoutOpts.stepper\" class=\"w-72 shrink-0 border-r border-slate-200 bg-white flex flex-col\">\n      <div class=\"p-5 border-b border-slate-100\">\n        <router-link to=\"/forms\" class=\"text-xs text-slate-500 hover:text-teal-600 inline-flex items-center gap-1\"><Icon name=\"arrow-left\" :size=\"12\"/> All forms<\u002Frouter-link>\n        <div class=\"mt-3 flex items-center gap-2\">\n          <TreatmentChip :treatment=\"schema.treatment\"/>\n          <span class=\"text-[11px] font-mono text-slate-500\">{{ formMeta?.code || '—' }}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"mt-2 font-semibold text-navy-900 text-sm leading-snug\">{{ schema.title }}<\u002Fdiv>\n        <div class=\"mt-1 relative\">\n          <button v-if=\"isMultiFacility\" type=\"button\" @click=\"toggleFacilityMenu\"\n                  class=\"inline-flex items-center gap-1 text-xs text-slate-500 hover:text-teal-600 focus-ring rounded\">\n            <span>{{ fac.name }}, {{ fac.state }}<\u002Fspan>\n            <Icon name=\"chevron-down\" :size=\"12\"/>\n          <\u002Fbutton>\n          <div v-else class=\"text-xs text-slate-500\">{{ fac.name }}, {{ fac.state }}<\u002Fdiv>\n          <div v-if=\"facilityMenuOpen\" v-click-outside=\"closeFacilityMenu\"\n               class=\"absolute z-20 mt-1 w-60 bg-white border border-slate-200 rounded-lg shadow-md py-1\">\n            <button v-for=\"f in boundFacilities\" :key=\"f.code\"\n                    @click=\"attemptFacilitySwitch(f.code)\"\n                    :class=\"['w-full text-left px-3 py-2 text-xs flex items-center justify-between hover:bg-slate-50',\n                             f.code === route.params.facility ? 'text-teal-700 font-medium' : 'text-navy-900']\">\n              <span>{{ f.name }}, {{ f.state }}<\u002Fspan>\n              <Icon v-if=\"f.code === route.params.facility\" name=\"check\" :size=\"12\" cls=\"text-teal-600\"/>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"flex-1 overflow-auto scroll-thin p-3 space-y-1\">\n        <button v-for=\"(sec,i) in schema.sections\" :key=\"sec.id\"\n                @click=\"goToSection(sec.id)\"\n                :class=\"['w-full flex items-start gap-3 text-left px-3 py-2.5 rounded-lg transition-colors',\n                         activeSection===sec.id ? 'bg-teal-50' : 'hover:bg-slate-50']\">\n          <div :class=\"['w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-semibold shrink-0',\n                         activeSection===sec.id ? 'bg-teal-100 text-teal-700 ring-2 ring-teal-500' :\n                         'bg-slate-100 text-slate-600']\">\n            <span>{{ i+1 }}<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"min-w-0 flex-1\">\n            <div :class=\"['text-sm font-medium', activeSection===sec.id ? 'text-teal-700' : 'text-navy-900']\">{{ sec.title }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Right: form content -->\n    <div class=\"flex-1 flex flex-col min-w-0\">\n      <div class=\"flex-1 overflow-auto scroll-thin\" @scroll=\"layoutOpts.single_scroll ? null : onScroll($event)\">\n        <div :class=\"['mx-auto px-8 py-8 space-y-8', layoutOpts.wide ? 'max-w-6xl' : 'max-w-4xl']\">\n          <!-- Compact header (only when stepper is hidden) -->\n          <div v-if=\"!layoutOpts.stepper\">\n            <router-link to=\"/forms\" class=\"text-xs text-slate-500 hover:text-teal-600 inline-flex items-center gap-1 mb-3\"><Icon name=\"arrow-left\" :size=\"12\"/> All forms<\u002Frouter-link>\n            <div class=\"flex items-center gap-2\">\n              <TreatmentChip :treatment=\"schema.treatment\"/>\n              <span class=\"text-[11px] font-mono text-slate-500\">{{ formMeta?.code || '—' }}<\u002Fspan>\n            <\u002Fdiv>\n            <h1 class=\"mt-2 font-semibold text-navy-900 text-2xl leading-tight tracking-tight\">{{ schema.title }}<\u002Fh1>\n            <div class=\"mt-1 relative\">\n              <button v-if=\"isMultiFacility\" type=\"button\" @click=\"toggleFacilityMenu\"\n                      class=\"inline-flex items-center gap-1 text-sm text-slate-500 hover:text-teal-600 focus-ring rounded\">\n                <span>{{ fac.name }}, {{ fac.state }}<\u002Fspan>\n                <Icon name=\"chevron-down\" :size=\"14\"/>\n              <\u002Fbutton>\n              <div v-else class=\"text-sm text-slate-500\">{{ fac.name }}, {{ fac.state }}<\u002Fdiv>\n              <div v-if=\"facilityMenuOpen\" v-click-outside=\"closeFacilityMenu\"\n                   class=\"absolute z-20 mt-1 w-64 bg-white border border-slate-200 rounded-lg shadow-md py-1\">\n                <button v-for=\"f in boundFacilities\" :key=\"f.code\"\n                        @click=\"attemptFacilitySwitch(f.code)\"\n                        :class=\"['w-full text-left px-3 py-2 text-sm flex items-center justify-between hover:bg-slate-50',\n                                 f.code === route.params.facility ? 'text-teal-700 font-medium' : 'text-navy-900']\">\n                  <span>{{ f.name }}, {{ f.state }}<\u002Fspan>\n                  <Icon v-if=\"f.code === route.params.facility\" name=\"check\" :size=\"14\" cls=\"text-teal-600\"/>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <!-- Validation banner -->\n          <div v-if=\"errorOpts.banner_mode==='banner' && showValidationBanner && Object.keys(errors).length\" class=\"bg-red-50 border border-red-200 text-red-900 rounded-lg p-4\">\n            <div class=\"flex items-start gap-3\">\n              <Icon name=\"alert-circle\" :size=\"20\" cls=\"text-red-600 mt-0.5\"/>\n              <div class=\"flex-1\">\n                <div class=\"font-semibold\">Please fix {{ Object.keys(errors).length }} field{{ Object.keys(errors).length>1?'s':'' }} before submitting<\u002Fdiv>\n                <ul class=\"mt-2 space-y-1 text-sm\">\n                  <li v-for=\"(msg,k) in errors\" :key=\"k\">\n                    <button @click=\"scrollToField(k)\" class=\"text-red-700 hover:underline inline-flex items-center gap-1\"><Icon name=\"arrow-right\" :size=\"12\"/>{{ msg }}<\u002Fbutton>\n                  <\u002Fli>\n                <\u002Ful>\n              <\u002Fdiv>\n              <button @click=\"showValidationBanner=false\" class=\"text-red-700 hover:bg-red-100 rounded p-1\"><Icon name=\"x\" :size=\"14\"/><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Sections -->\n          <section v-for=\"sec in schema.sections\" :key=\"sec.id\" :id=\"'sec-'+sec.id\" class=\"bg-white border border-slate-200 rounded-lg shadow-card\">\n            <header class=\"px-6 py-4 border-b border-slate-100\">\n              <h2 class=\"font-semibold text-navy-900\">{{ sec.title }}<\u002Fh2>\n              <p v-if=\"sec.subtitle\" class=\"text-xs text-slate-500 mt-0.5\">{{ sec.subtitle }}<\u002Fp>\n            <\u002Fheader>\n\n            <!-- Legal blurb for declaration -->\n            <div v-if=\"sec.legal\" class=\"px-6 py-4 bg-slate-50 border-b border-slate-100 text-xs text-slate-600 leading-relaxed\">\n              {{ sec.legal }}\n            <\u002Fdiv>\n\n            <div class=\"p-6 space-y-5\">\n              <!-- Regular fields -->\n              <div v-for=\"f in sec.fields || []\" :key=\"f.key\">\n                <div v-if=\"visibleField(f)\">\n                  <label :for=\"'fld-'+f.key\" class=\"block text-xs font-medium text-slate-700 mb-1.5\">\n                    {{ f.label }}\n                    <span v-if=\"isFieldRequired(f)\" class=\"text-red-500\">*<\u002Fspan>\n                    <span v-if=\"sec.prefill && f.prefill\" class=\"ml-2 text-[10px] uppercase tracking-wider text-slate-400\">pre-filled from profile<\u002Fspan>\n                  <\u002Flabel>\n\n                  <!-- Text-like -->\n                  <input v-if=\"['text','email','phone'].includes(f.type)\"\n                         :id=\"'fld-'+f.key\" v-model=\"data[f.key]\"\n                         :type=\"f.type==='phone'?'tel':f.type\"\n                         :placeholder=\"f.placeholder\"\n                         :readonly=\"f.readonly || (sec.prefill && f.prefill)\"\n                         :class=\"inputCls(f)\" />\n\n                  <!-- Number -->\n                  <input v-else-if=\"f.type==='number'\"\n                         :id=\"'fld-'+f.key\" v-model.number=\"data[f.key]\" type=\"number\"\n                         :step=\"f.step || 1\" :min=\"f.min\" :max=\"f.max\"\n                         :class=\"inputCls(f)\"/>\n\n                  <!-- Date -->\n                  <input v-else-if=\"f.type==='date'\"\n                         :id=\"'fld-'+f.key\" v-model=\"data[f.key]\" type=\"date\"\n                         :class=\"inputCls(f)\"/>\n\n                  <!-- Textarea -->\n                  <div v-else-if=\"f.type==='textarea'\">\n                    <textarea :id=\"'fld-'+f.key\" v-model=\"data[f.key]\" :rows=\"f.rows || 3\"\n                              :maxlength=\"f.maxLength\" :placeholder=\"f.placeholder\"\n                              :class=\"inputCls(f)\"><\u002Ftextarea>\n                    <div v-if=\"f.charCounter && f.maxLength\" class=\"mt-1 text-[11px] text-slate-400 text-right\">\n                      {{ (data[f.key] || '').length }} / {{ f.maxLength }} characters\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <!-- Computed (auto-calculated, readonly) -->\n                  <input v-else-if=\"f.type==='computed'\"\n                         :id=\"'fld-'+f.key\" :value=\"computedValue(f)\" readonly\n                         :class=\"['w-full rounded-lg border px-3 py-2 text-sm focus-ring border-slate-200 bg-slate-50 text-slate-700', f.tabular ? 'tabular-nums' : '']\"/>\n\n                  <!-- File upload (multi) -->\n                  <div v-else-if=\"f.type==='file-multi'\" :id=\"'fld-'+f.key\" class=\"space-y-2\">\n                    <label class=\"flex flex-col items-center justify-center gap-1 px-6 py-6 rounded-lg border-2 border-dashed border-slate-300 bg-slate-50/40 hover:bg-slate-50 cursor-pointer transition-colors\">\n                      <Icon name=\"upload-cloud\" :size=\"22\" cls=\"text-slate-400\"/>\n                      <div class=\"text-sm text-teal-600 font-medium\">Click to upload <span class=\"text-slate-500 font-normal\">or drag and drop<\u002Fspan><\u002Fdiv>\n                      <div class=\"text-[11px] text-slate-400\">{{ f.acceptLabel || 'PNG, JPG or PDF' }}<\u002Fdiv>\n                      <input type=\"file\" multiple :accept=\"f.accept || '.png,.jpg,.jpeg,.pdf'\"\n                             @change=\"onFileSelect(f, $event)\" class=\"hidden\"/>\n                    <\u002Flabel>\n                    <div v-if=\"(data[f.key] || []).length\" class=\"space-y-1\">\n                      <div v-for=\"(file,i) in data[f.key]\" :key=\"i\"\n                           class=\"flex items-center gap-3 px-3 py-2 rounded-lg border border-slate-200 bg-white text-sm\">\n                        <Icon :name=\"file.type === 'application/pdf' ? 'file-text' : 'image'\" :size=\"14\" cls=\"text-slate-400\"/>\n                        <span class=\"flex-1 truncate text-slate-700\">{{ file.name }}<\u002Fspan>\n                        <span class=\"text-[11px] text-slate-400 tabular-nums\">{{ fmtFileSize(file.size) }}<\u002Fspan>\n                        <button type=\"button\" @click=\"removeFile(f, i)\" class=\"p-1 rounded hover:bg-red-50 text-slate-400 hover:text-red-600\">\n                          <Icon name=\"x\" :size=\"14\"/>\n                        <\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <!-- Radio -->\n                  <div v-else-if=\"f.type==='radio'\" class=\"flex flex-wrap gap-2\" :id=\"'fld-'+f.key\">\n                    <label v-for=\"opt in f.options\" :key=\"opt\"\n                           :class=\"['flex items-center gap-2 px-3 py-2 rounded-lg border cursor-pointer text-sm',\n                                    data[f.key]===opt ? 'border-teal-500 bg-teal-50 text-teal-700' : 'border-slate-300 hover:bg-slate-50']\">\n                      <input type=\"radio\" :value=\"opt\" v-model=\"data[f.key]\" class=\"accent-teal-500\"/>\n                      {{ opt }}\n                    <\u002Flabel>\n                  <\u002Fdiv>\n\n                  <!-- Checkbox -->\n                  <div v-else-if=\"f.type==='checkbox'\" class=\"space-y-1.5\" :id=\"'fld-'+f.key\">\n                    <label v-for=\"opt in f.options\" :key=\"opt\" class=\"flex items-center gap-2 text-sm text-slate-700\">\n                      <input type=\"checkbox\" :value=\"opt\" v-model=\"data[f.key]\" class=\"rounded accent-teal-500\"/>{{ opt }}\n                    <\u002Flabel>\n                  <\u002Fdiv>\n\n                  <!-- Select -->\n                  <select v-else-if=\"f.type==='select'\"\n                          :id=\"'fld-'+f.key\" v-model=\"data[f.key]\" :class=\"inputCls(f)\">\n                    <option value=\"\">Select…<\u002Foption>\n                    <template v-if=\"f.source\">\n                      <option v-for=\"o in sourceLists[f.source]\" :key=\"o.id\" :value=\"o.id\">{{ o.name }}<\u002Foption>\n                    <\u002Ftemplate>\n                    <template v-else>\n                      <option v-for=\"o in f.options\" :key=\"o\" :value=\"o\">{{ o }}<\u002Foption>\n                    <\u002Ftemplate>\n                  <\u002Fselect>\n\n                  <!-- Searchable dropdown (combobox with datalist) -->\n                  <div v-else-if=\"f.type==='searchable-dropdown'\" class=\"relative\">\n                    <Icon name=\"search\" :size=\"14\" cls=\"absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none\"/>\n                    <input :id=\"'fld-'+f.key\" v-model=\"data[f.key]\"\n                           :list=\"'dl-'+f.key\"\n                           :placeholder=\"f.placeholder || 'Search…'\"\n                           :class=\"[inputCls(f),'pl-8']\"/>\n                    <datalist :id=\"'dl-'+f.key\">\n                      <template v-if=\"f.source\">\n                        <option v-for=\"o in sourceLists[f.source]\" :key=\"o.id\" :value=\"o.name\"><\u002Foption>\n                      <\u002Ftemplate>\n                      <template v-else>\n                        <option v-for=\"o in f.options\" :key=\"o\" :value=\"o\"><\u002Foption>\n                      <\u002Ftemplate>\n                    <\u002Fdatalist>\n                  <\u002Fdiv>\n\n                  <!-- Google-style address (text + map-pin affordance) -->\n                  <div v-else-if=\"f.type==='google-address'\" class=\"relative\">\n                    <Icon name=\"map-pin\" :size=\"14\" cls=\"absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none\"/>\n                    <input :id=\"'fld-'+f.key\" v-model=\"data[f.key]\" type=\"text\"\n                           :placeholder=\"f.placeholder || 'Start typing an address…'\"\n                           :class=\"[inputCls(f),'pl-8']\"/>\n                  <\u002Fdiv>\n\n                  <!-- File -->\n                  <FileUploadField v-else-if=\"f.type==='file-upload'\"\n                                   v-model=\"data[f.key]\" :accept=\"f.accept\" :id=\"'fld-'+f.key\"/>\n\n                  <!-- Signature -->\n                  <SignaturePad v-else-if=\"f.type==='signature' && declarationOpts.type==='signature'\"\n                                v-model=\"data[f.key]\" :id=\"'fld-'+f.key\"/>\n\n                  <!-- Declaration checkbox alternative -->\n                  <label v-else-if=\"f.type==='signature' && declarationOpts.type==='checkbox'\"\n                         :for=\"'fld-'+f.key\"\n                         class=\"flex items-start gap-3 px-4 py-3 rounded-lg border border-slate-300 bg-slate-50/40 cursor-pointer hover:bg-slate-50\">\n                    <input :id=\"'fld-'+f.key\" type=\"checkbox\"\n                           :checked=\"data[f.key]==='YES'\"\n                           @change=\"data[f.key] = $event.target.checked ? 'YES' : 'NO'\"\n                           class=\"mt-0.5 rounded accent-teal-500\"/>\n                    <span class=\"text-sm text-navy-900\">I agree to the declaration above.<\u002Fspan>\n                  <\u002Flabel>\n\n                  <div v-if=\"submitAttempted && errors[f.key]\" class=\"mt-1 text-xs text-red-600 flex items-center gap-1\">\n                    <Icon name=\"alert-circle\" :size=\"12\"/>{{ errors[f.key] }}\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- Repeater -->\n              <div v-if=\"sec.repeater\" class=\"-mx-6\">\n                <div class=\"overflow-x-auto scroll-thin\">\n                  <table class=\"w-full text-sm\">\n                    <thead class=\"bg-slate-50 border-y border-slate-100 text-xs text-slate-500 uppercase tracking-wider\">\n                      <tr>\n                        <th class=\"px-6 py-2 text-left\" v-for=\"c in sec.repeater.columns\" :key=\"c.key\" :class=\"c.w\">{{ c.label }}<\u002Fth>\n                        <th class=\"w-10 sticky right-0 bg-slate-50\"><\u002Fth>\n                      <\u002Ftr>\n                    <\u002Fthead>\n                    <tbody class=\"divide-y divide-slate-100\">\n                      <template v-for=\"(row,i) in data[sec.repeater.key]\" :key=\"i\">\n                        <tr>\n                          <td v-for=\"c in sec.repeater.columns\" :key=\"c.key\" class=\"px-6 py-2 align-top\" :class=\"c.w\">\n                            <input v-if=\"c.type==='text'\" v-model=\"row[c.key]\" :maxlength=\"c.maxLength\" :class=\"rowInputCls(sec, i, c)\"/>\n                            <input v-else-if=\"c.type==='number'\" v-model.number=\"row[c.key]\" type=\"number\" :min=\"c.min\" :max=\"c.max\" :step=\"c.step||1\" :class=\"rowInputCls(sec, i, c)\"/>\n                            <select v-else-if=\"c.type==='select'\" v-model=\"row[c.key]\" @change=\"onProductChange(sec, row, c)\" :class=\"rowInputCls(sec, i, c)\">\n                              <option value=\"\">Select…<\u002Foption>\n                              <option v-for=\"o in c.options\" :key=\"o\" :value=\"o\">{{ o }}<\u002Foption>\n                            <\u002Fselect>\n                            <input v-else-if=\"c.type==='searchable-dropdown'\" v-model=\"row[c.key]\"\n                                   :list=\"'rdl-'+sec.id+'-'+c.key\" :maxlength=\"c.maxLength\" :placeholder=\"c.placeholder || 'Search…'\"\n                                   :class=\"rowInputCls(sec, i, c)\"/>\n                            <datalist v-if=\"c.type==='searchable-dropdown'\" :id=\"'rdl-'+sec.id+'-'+c.key\">\n                              <template v-if=\"c.source\">\n                                <option v-for=\"o in sourceLists[c.source]\" :key=\"o.id\" :value=\"o.name\"><\u002Foption>\n                              <\u002Ftemplate>\n                              <template v-else>\n                                <option v-for=\"o in c.options\" :key=\"o\" :value=\"o\"><\u002Foption>\n                              <\u002Ftemplate>\n                            <\u002Fdatalist>\n                            <input v-else-if=\"c.type==='google-address'\" v-model=\"row[c.key]\" type=\"text\"\n                                   :maxlength=\"c.maxLength\" :placeholder=\"c.placeholder || 'Start typing an address…'\"\n                                   :class=\"rowInputCls(sec, i, c)\"/>\n                            <input v-else-if=\"c.type==='readonly-number'\" :value=\"row[c.key]\" readonly class=\"w-full rounded border border-slate-200 bg-slate-50 px-2 py-1.5 text-sm text-slate-500 tabular-nums\"/>\n                            <div v-else-if=\"c.type==='calculated'\" class=\"px-2 py-1.5 text-sm text-navy-900 font-medium tabular-nums\">{{ fmtMoney(calc(c, row)) }}<\u002Fdiv>\n                            <div v-if=\"submitAttempted && rowErrors[sec.repeater.key+'.'+i]?.[c.key]\"\n                                 class=\"mt-1 text-[11px] text-red-600 flex items-start gap-1 leading-snug\">\n                              <Icon name=\"alert-circle\" :size=\"11\" cls=\"mt-0.5\"/>\n                              <span>{{ rowErrors[sec.repeater.key+'.'+i][c.key] }}<\u002Fspan>\n                            <\u002Fdiv>\n                          <\u002Ftd>\n                          <td class=\"px-4 py-2 align-top sticky right-0 bg-white\">\n                            <button type=\"button\" @click=\"removeRow(sec, i)\" :disabled=\"data[sec.repeater.key].length<=(sec.repeater.minRows||1)\"\n                                    class=\"p-1 rounded hover:bg-red-50 text-slate-400 hover:text-red-600 disabled:opacity-30 disabled:cursor-not-allowed\">\n                              <Icon name=\"trash-2\" :size=\"14\"/>\n                            <\u002Fbutton>\n                          <\u002Ftd>\n                        <\u002Ftr>\n                      <\u002Ftemplate>\n                    <\u002Ftbody>\n                  <\u002Ftable>\n                <\u002Fdiv>\n                <div class=\"px-6 py-3 border-t border-slate-100 flex items-center gap-3\">\n                  <button type=\"button\" @click=\"addRow(sec)\"\n                          :disabled=\"sec.repeater.maxRows && data[sec.repeater.key].length >= sec.repeater.maxRows\"\n                          class=\"text-sm text-teal-600 hover:text-teal-700 font-medium inline-flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed\">\n                    <Icon name=\"plus\" :size=\"14\"/> {{ sec.repeater.addLabel || 'Add line' }}\n                  <\u002Fbutton>\n                  <span v-if=\"sec.repeater.maxRows\" class=\"text-[11px] text-slate-400\">{{ data[sec.repeater.key].length }} / {{ sec.repeater.maxRows }} rows<\u002Fspan>\n                  <span v-if=\"submitAttempted && errors[sec.repeater.key]\" class=\"text-[11px] text-red-600 inline-flex items-center gap-1\">\n                    <Icon name=\"alert-circle\" :size=\"11\"/>{{ errors[sec.repeater.key] }}\n                  <\u002Fspan>\n                <\u002Fdiv>\n                <div v-if=\"sec.repeater.note\" class=\"px-6 py-3 border-t border-slate-100 bg-amber-50/50 text-[11px] text-amber-900 leading-relaxed\">\n                  <Icon name=\"info\" :size=\"12\" cls=\"inline mr-1\"/>{{ sec.repeater.note }}\n                <\u002Fdiv>\n                <!-- Totals -->\n                <div v-if=\"sec.repeater.totals\" class=\"px-6 py-4 border-t border-slate-100 bg-slate-50\">\n                  <div class=\"ml-auto max-w-xs space-y-1 text-sm\">\n                    <div v-for=\"t in sec.repeater.totals\" :key=\"t.key\" class=\"flex justify-between\"\n                         :class=\"t.key==='grandTotal' ? 'pt-2 border-t border-slate-200 font-semibold text-navy-900' : 'text-slate-600'\">\n                      <span>{{ t.label }}<\u002Fspan>\n                      <span class=\"tabular-nums\">{{ fmtMoney(repeaterTotals(sec, data[sec.repeater.key])[t.key]) }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- Pallet Repeater (Treatment Details, with Market + nested commodities) -->\n              <template v-if=\"sec.palletRepeater\">\n                <!-- Market field -->\n                <div v-if=\"sec.market\">\n                  <label :for=\"'fld-'+sec.market.key\" class=\"block text-xs font-medium text-slate-700 mb-1.5\">\n                    {{ sec.market.label }}\n                    <span v-if=\"sec.market.required\" class=\"text-red-500\">*<\u002Fspan>\n                  <\u002Flabel>\n                  <select :id=\"'fld-'+sec.market.key\" v-model=\"data[sec.market.key]\"\n                          :class=\"['w-full rounded-lg border px-3 py-2 text-sm focus-ring',\n                                   submitAttempted && errors[sec.market.key] ? 'border-red-400 bg-red-50/40' : 'border-slate-300']\">\n                    <option value=\"\">{{ sec.market.placeholder || 'Select…' }}<\u002Foption>\n                    <option v-for=\"o in sec.market.options\" :key=\"o\" :value=\"o\">{{ o }}<\u002Foption>\n                  <\u002Fselect>\n                  <div v-if=\"submitAttempted && errors[sec.market.key]\" class=\"mt-1 text-[11px] text-red-600 flex items-start gap-1\">\n                    <Icon name=\"alert-circle\" :size=\"11\" cls=\"mt-0.5\"/><span>{{ errors[sec.market.key] }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <!-- Pallet space cards, grouped by kind -->\n                <div class=\"space-y-6\">\n                  <!-- Group: Irradiated -->\n                  <div v-for=\"(group, gIdx) in [{kind:'irradiated', label:'Irradiated Pallets'}, {kind:'non_irradiated', label:'Non-Irradiated Pallets'}]\" :key=\"group.kind\">\n                    <template v-if=\"data[sec.palletRepeater.key].some(ps => ps.kind === group.kind)\">\n                      <h3 class=\"text-sm font-semibold text-navy-900 mb-3\">{{ group.label }}<\u002Fh3>\n                      <div class=\"space-y-4\">\n                        <div v-for=\"(ps, psIdx) in data[sec.palletRepeater.key]\" :key=\"ps.id\">\n                          <div v-if=\"ps.kind === group.kind\"\n                               :class=\"['rounded-lg border overflow-hidden',\n                                        group.kind === 'irradiated' ? 'border-teal-200' : 'border-amber-200']\">\n                            <!-- Pallet space header strip -->\n                            <div :class=\"['px-4 py-3 border-b flex items-center gap-4',\n                                          group.kind === 'irradiated' ? 'bg-teal-50/60 border-teal-100' : 'bg-amber-50/60 border-amber-100']\">\n                              <div class=\"flex items-center gap-2\">\n                                <span :class=\"['w-6 h-6 rounded-full flex items-center justify-center text-xs font-semibold',\n                                              group.kind === 'irradiated' ? 'bg-teal-500 text-white' : 'bg-amber-500 text-white']\">\n                                  {{ data[sec.palletRepeater.key].filter((p,j) => p.kind === group.kind && j <= psIdx).length }}\n                                <\u002Fspan>\n                                <span class=\"text-sm font-semibold text-navy-900\">\n                                  {{ group.kind === 'irradiated' ? 'Pallet Space' : 'Non-Irradiated Pallet Space' }}\n                                <\u002Fspan>\n                              <\u002Fdiv>\n                              <!-- Pallet-level fields inline -->\n                              <div class=\"flex items-end gap-3 flex-1\">\n                                <div v-for=\"pf in sec.palletRepeater.palletFields\" :key=\"pf.key\" :class=\"pf.w\">\n                                  <label class=\"block text-[10px] uppercase tracking-wider text-slate-500 mb-1\">\n                                    {{ pf.label }}<span v-if=\"pf.required\" class=\"text-red-500\">*<\u002Fspan>\n                                  <\u002Flabel>\n                                  <input v-if=\"pf.type==='number'\" type=\"number\" v-model.number=\"ps[pf.key]\"\n                                         :min=\"pf.min\" :max=\"pf.max\"\n                                         :class=\"['w-full rounded border px-2 py-1.5 text-sm focus-ring bg-white',\n                                                  submitAttempted && rowErrors['ps.'+psIdx+'.'+pf.key] ? 'border-red-400' : 'border-slate-300']\"/>\n                                  <select v-else-if=\"pf.type==='select'\" v-model=\"ps[pf.key]\"\n                                          :class=\"['w-full rounded border px-2 py-1.5 text-sm focus-ring bg-white',\n                                                   submitAttempted && rowErrors['ps.'+psIdx+'.'+pf.key] ? 'border-red-400' : 'border-slate-300']\">\n                                    <option value=\"\">Select…<\u002Foption>\n                                    <option v-for=\"o in pf.options\" :key=\"o\" :value=\"o\">{{ o }}<\u002Foption>\n                                  <\u002Fselect>\n                                <\u002Fdiv>\n                                <!-- Rollups -->\n                                <div v-for=\"r in sec.palletRepeater.rollups\" :key=\"r.key\" class=\"text-right\">\n                                  <div class=\"text-[10px] uppercase tracking-wider text-slate-500\">{{ r.label }}<\u002Fdiv>\n                                  <div class=\"text-sm font-semibold text-navy-900 tabular-nums\">{{ palletRollup(ps, r.formula.split(':')[1]) }}<\u002Fdiv>\n                                <\u002Fdiv>\n                              <\u002Fdiv>\n                              <!-- Remove pallet space -->\n                              <button type=\"button\" @click=\"removePalletSpace(psIdx)\"\n                                      :disabled=\"data[sec.palletRepeater.key].length <= (sec.palletRepeater.minPalletSpaces || 1)\"\n                                      class=\"p-1.5 rounded hover:bg-white/60 text-slate-400 hover:text-red-600 disabled:opacity-30 disabled:cursor-not-allowed\">\n                                <Icon name=\"x\" :size=\"16\"/>\n                              <\u002Fbutton>\n                            <\u002Fdiv>\n\n                            <!-- Commodities table -->\n                            <div class=\"overflow-x-auto scroll-thin bg-white\">\n                              <table class=\"w-full text-sm\">\n                                <thead class=\"bg-slate-50 border-b border-slate-100 text-[11px] text-slate-500 uppercase tracking-wider\">\n                                  <tr>\n                                    <th class=\"pl-4 pr-2 py-2 text-left w-8\">#<\u002Fth>\n                                    <th class=\"px-3 py-2 text-left\" v-for=\"cf in sec.palletRepeater.commodityFields\" :key=\"cf.key\" :class=\"cf.w\">\n                                      {{ cf.label }}<span v-if=\"cf.required\" class=\"text-red-500\">*<\u002Fspan>\n                                    <\u002Fth>\n                                    <th class=\"w-10 sticky right-0 bg-slate-50\"><\u002Fth>\n                                  <\u002Ftr>\n                                <\u002Fthead>\n                                <tbody class=\"divide-y divide-slate-100\">\n                                  <tr v-for=\"(com, cIdx) in ps.commodities\" :key=\"cIdx\">\n                                    <td class=\"pl-4 pr-2 py-2 align-top text-xs text-slate-400 tabular-nums pt-3\">{{ cIdx + 1 }}<\u002Ftd>\n                                    <td v-for=\"cf in sec.palletRepeater.commodityFields\" :key=\"cf.key\" class=\"px-3 py-2 align-top\" :class=\"cf.w\">\n                                      <input v-if=\"cf.type==='text'\" v-model=\"com[cf.key]\" :maxlength=\"cf.maxLength\" :placeholder=\"cf.placeholder\"\n                                             :class=\"['w-full rounded border px-2 py-1.5 text-sm focus-ring',\n                                                      submitAttempted && rowErrors['ps.'+psIdx+'.com.'+cIdx+'.'+cf.key] ? 'border-red-400 bg-red-50/40' : 'border-slate-300']\"/>\n                                      <input v-else-if=\"cf.type==='number'\" type=\"number\" v-model.number=\"com[cf.key]\"\n                                             :min=\"cf.min\" :step=\"cf.step || 1\" :placeholder=\"cf.placeholder\"\n                                             :class=\"['w-full rounded border px-2 py-1.5 text-sm focus-ring',\n                                                      submitAttempted && rowErrors['ps.'+psIdx+'.com.'+cIdx+'.'+cf.key] ? 'border-red-400 bg-red-50/40' : 'border-slate-300']\"/>\n                                      <input v-else-if=\"cf.type==='searchable-dropdown'\" v-model=\"com[cf.key]\"\n                                             :list=\"'cdl-'+ps.id+'-'+cf.key\" :maxlength=\"cf.maxLength\" :placeholder=\"cf.placeholder || 'Search…'\"\n                                             :class=\"['w-full rounded border px-2 py-1.5 text-sm focus-ring',\n                                                      submitAttempted && rowErrors['ps.'+psIdx+'.com.'+cIdx+'.'+cf.key] ? 'border-red-400 bg-red-50/40' : 'border-slate-300']\"/>\n                                      <datalist v-if=\"cf.type==='searchable-dropdown'\" :id=\"'cdl-'+ps.id+'-'+cf.key\">\n                                        <option v-for=\"o in sourceLists[cf.source]\" :key=\"o.id\" :value=\"o.name\"><\u002Foption>\n                                      <\u002Fdatalist>\n                                      <input v-else-if=\"cf.type==='google-address'\" v-model=\"com[cf.key]\" type=\"text\"\n                                             :maxlength=\"cf.maxLength\" :placeholder=\"cf.placeholder || 'Start typing an address…'\"\n                                             :class=\"['w-full rounded border px-2 py-1.5 text-sm focus-ring',\n                                                      submitAttempted && rowErrors['ps.'+psIdx+'.com.'+cIdx+'.'+cf.key] ? 'border-red-400 bg-red-50/40' : 'border-slate-300']\"/>\n                                    <\u002Ftd>\n                                    <td class=\"px-2 py-2 align-top sticky right-0 bg-white\">\n                                      <button type=\"button\" @click=\"removeCommodity(psIdx, cIdx)\" :disabled=\"ps.commodities.length <= 1\"\n                                              class=\"p-1 rounded hover:bg-red-50 text-slate-400 hover:text-red-600 disabled:opacity-30 disabled:cursor-not-allowed mt-1\">\n                                        <Icon name=\"trash-2\" :size=\"14\"/>\n                                      <\u002Fbutton>\n                                    <\u002Ftd>\n                                  <\u002Ftr>\n                                <\u002Ftbody>\n                              <\u002Ftable>\n                            <\u002Fdiv>\n                            <div class=\"px-4 py-2 bg-slate-50/50 border-t border-slate-100\">\n                              <button type=\"button\" @click=\"addCommodity(psIdx)\"\n                                      class=\"text-xs text-teal-600 hover:text-teal-700 font-medium inline-flex items-center gap-1\">\n                                <Icon name=\"plus\" :size=\"12\"/> Add Commodity\n                              <\u002Fbutton>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Ftemplate>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <!-- Add pallet space buttons -->\n                <div class=\"flex flex-wrap gap-2 pt-2\">\n                  <button type=\"button\" @click=\"addPalletSpace('irradiated')\"\n                          class=\"inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-teal-200 text-teal-700 hover:bg-teal-50 text-sm font-medium\">\n                    <Icon name=\"plus\" :size=\"14\"/> {{ sec.palletRepeater.addIrradiatedLabel || 'Add Pallet Space' }}\n                  <\u002Fbutton>\n                  <button type=\"button\" @click=\"addPalletSpace('non_irradiated')\"\n                          class=\"inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-amber-200 text-amber-700 hover:bg-amber-50 text-sm font-medium\">\n                    <Icon name=\"plus\" :size=\"14\"/> {{ sec.palletRepeater.addNonIrradiatedLabel || 'Add Non-Irradiated Pallet Space' }}\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Ftemplate>\n              <!-- /Pallet Repeater -->\n\n              <div v-if=\"false\">\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <div class=\"text-[11px] text-slate-400 pt-4 pb-16 text-center\">\n            Form schema: <span class=\"font-mono\">{{ schemaKey }}<\u002Fspan> · Rendered by the dynamic form engine\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Sticky footer -->\n      <div class=\"border-t border-slate-200 bg-white px-8 py-4 flex items-center gap-3 shrink-0\">\n        <Btn as=\"router-link\" :to=\"{ path:'/forms' }\" kind=\"ghost\" icon=\"x\">Cancel<\u002FBtn>\n        <div class=\"flex-1\"><\u002Fdiv>\n        <Btn kind=\"primary\" :disabled=\"submitting\" iconRight=\"arrow-right\" action=\"submit\" @click=\"submit\">\n          {{ submitting ? 'Submitting…' : 'Submit request' }}\n        <\u002FBtn>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Mid-form facility switch modal -->\n    <transition name=\"fade\">\n      <div v-if=\"switchModal\" class=\"fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4\" @click.self=\"cancelSwitch\">\n        <div class=\"bg-white rounded-xl shadow-md w-full max-w-md overflow-hidden\">\n          <!-- Unavailable -->\n          <template v-if=\"switchModal.kind === 'unavailable'\">\n            <div class=\"px-6 py-5\">\n              <div class=\"flex items-start gap-3\">\n                <div class=\"w-9 h-9 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center shrink-0\">\n                  <Icon name=\"alert-triangle\" :size=\"18\"/>\n                <\u002Fdiv>\n                <div class=\"min-w-0\">\n                  <h3 class=\"font-semibold text-navy-900\">{{ switchModal.targetName.split(',')[0] }} doesn't offer this form<\u002Fh3>\n                  <p class=\"mt-1 text-sm text-slate-600\">This form isn't available at {{ switchModal.targetName }}. Stay on the current facility, or pick a different form from the catalog.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"px-6 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-end\">\n              <Btn kind=\"primary\" @click=\"cancelSwitch\">OK<\u002FBtn>\n            <\u002Fdiv>\n          <\u002Ftemplate>\n          <!-- Confirm switch -->\n          <template v-else>\n            <div class=\"px-6 py-5\">\n              <h3 class=\"font-semibold text-navy-900\">Switch to {{ switchModal.targetName }}?<\u002Fh3>\n              <p class=\"mt-2 text-sm text-slate-600\">\n                Switching will require <span class=\"font-medium text-navy-900\">{{ switchModal.delta.length }}<\u002Fspan>\n                new field<span v-if=\"switchModal.delta.length !== 1\">s<\u002Fspan> and discard\n                <span class=\"font-medium text-navy-900\">{{ switchModal.removed.length }}<\u002Fspan>\n                field<span v-if=\"switchModal.removed.length !== 1\">s<\u002Fspan> that don't apply at {{ switchModal.targetName.split(',')[0] }}. Your other answers will be preserved.\n              <\u002Fp>\n            <\u002Fdiv>\n            <div class=\"px-6 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-2\">\n              <Btn kind=\"ghost\" @click=\"cancelSwitch\">Cancel<\u002FBtn>\n              <Btn kind=\"primary\" iconRight=\"arrow-right\" @click=\"confirmSwitch\">Switch<\u002FBtn>\n            <\u002Fdiv>\n          <\u002Ftemplate>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ftransition>\n  <\u002Fdiv>`\n};\n\n/* ---------- Page: Submission Confirmation ----------------------------------- */\n\nconst SubmittedPage = {\n  components:{ Icon, Btn, TreatmentChip, BcSyncChip, StatusBadge },\n  computed:{\n    order(){ return state.orders.find(o => o.id === this.$route.params.id); }\n  },\n  template:`\n  <div v-if=\"!order\" clas  text-slate-500\">Exsited order ID<\u002Fdiv>\n          <div class=\"mt-1 font-mono text-navy-900\">{{ order.exsitedId }}<\u002Fdiv>\n          <div class=\"text-xs text-emerald-600 mt-1 inline-flex items-center gap-1\"><Icon name=\"check-circle-2\" :size=\"12\"/> Created in Exsited<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"text-[11px] uppercase tracking-wider text-slate-500\">Business Central<\u002Fdiv>\n          <div class=\"mt-1 group relative inline-block\">\n            <BcSyncChip :status=\"order.bcSync\"/>\n            <div class=\"absolute z-10 left-0 top-full mt-1 hidden group-hover:block bg-navy-900 text-white text-[11px] rounded px-2 py-1 w-56 shadow-md\">\n              Your order will appear in Business Central within 60 seconds.\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"text-xs text-slate-500 mt-1\">Async push in progress — typically &lt; 5 min.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"px-8 py-5 border-t border-slate-100 bg-slate-50 flex flex-wrap items-center gap-3\">\n        <Btn as=\"router-link\" :to=\"{ path:'/orders/'+order.id }\" icon=\"file-text\">View order<\u002FBtn>\n        <Btn as=\"router-link\" :to=\"{ path:'/forms' }\" kind=\"secondary\" icon=\"file-plus-2\">Submit another<\u002FBtn>\n        <Btn kind=\"ghost\" icon=\"download\">Download PDF<\u002FBtn>\n        <div class=\"flex-1\"><\u002Fdiv>\n        <router-link to=\"/dashboard\" class=\"text-sm text-slate-500 hover:text-teal-600\">Back to dashboard<\u002Frouter-link>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`,\n  methods:{ fmtDate }\n};\n\n/* ---------- Page: Orders List ----------------------------------------------- */\n\nconst OrdersPage = {\n  components:{ Icon, Btn, TreatmentChip, BcSyncChip, StatusBadge, Skel, EmptyState },\n  data(){ return { loading:true, q:'', facility:'ALL', treatment:'ALL', bc:'ALL', dateFrom:'', dateTo:'', sort:{ by:'submitted', dir:'desc' } }; },\n  mounted(){ setTimeout(() => { this.loading = false; }, 300); },\n  computed:{\n    state(){ return state; },\n    myFacilities(){ return FACILITIES.filter(f => state.profile.facilities.includes(f.code)); },\n    filtered(){\n      let list = state.orders.slice();\n      if (this.facility!=='ALL')  list = list.filter(o => o.facility === this.facility);\n      if (this.treatment!=='ALL') list = list.filter(o => o.treatment === this.treatment);\n      if (this.bc!=='ALL')        list = list.filter(o => o.bcSync === this.bc);\n      if (this.dateFrom)          list = list.filter(o => o.submitted >= this.dateFrom);\n      if (this.dateTo)            list = list.filter(o => o.submitted <= this.dateTo);\n      if (this.q) {\n        const q = this.q.toLowerCase();\n        list = list.filter(o => [o.id,o.po,o.consignor,o.consignee,o.goods,o.formName].some(v => String(v).toLowerCase().includes(q)));\n      }\n      list.sort((a,b)=>{\n        const av=a[this.sort.by], bv=b[this.sort.by]; const m = this.sort.dir==='asc'?1:-1;\n        return av>bv?m:av<bv?-m:0;\n      });\n      return list;\n    }\n  },\n  methods:{\n    fmtDate, fmtMoney,\n    setSort(by){\n      if (this.sort.by === by) this.sort.dir = this.sort.dir==='asc'?'desc':'asc';\n      else { this.sort.by = by; this.sort.dir = 'desc'; }\n    },\n    sortIcon(by){ return this.sort.by===by ? (this.sort.dir==='asc'?'chevron-up':'chevron-down') : 'chevrons-up-down'; }\n  },\n  template:`\n  <div class=\"p-8 space-y-5 max-w-[1600px]\">\n    <div class=\"flex items-start justify-between flex-wrap gap-4\">\n      <div>\n        <div class=\"text-xs font-semibold text-teal-600 uppercase tracking-wider mb-1\">My Orders<\u002Fdiv>\n        <h1 class=\"text-2xl font-semibold text-navy-900\">All treatment requests<\u002Fh1>\n        <p class=\"text-sm text-slate-500 mt-1\">{{ state.orders.length }} orders across {{ state.profile.facilities.length }} facilities. Click any row for details.<\u002Fp>\n      <\u002Fdiv>\n      <div focus-ring bg-white\" aria-label=\"From date\"/>\n        <span class=\"text-slate-400\">→<\u002Fspan>\n        <input type=\"date\" v-model=\"dateTo\"   class=\"px-2 py-2 rounded-lg border border-slate-300 text-sm focus-ring bg-white\" aria-label=\"To date\"/>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Table -->\n    <div class=\"bg-white border border-slate-200 rounded-lg shadow-card overflow-hidden\">\n      <table class=\"w-full text-sm\">\n        <thead class=\"bg-slate-50 text-left text-xs text-slate-500 uppercase tracking-wider\">\n          <tr>\n            <th class=\"px-5 py-3\"><button @click=\"setSort('id')\" class=\"inline-flex items-center gap-1\">Reference <Icon :name=\"sortIcon('id')\" :size=\"12\"/><\u002Fbutton><\u002Fth>\n            <th class=\"px-5 py-3\">Facility<\u002Fth>\n            <th class=\"px-5 py-3\">Form<\u002Fth>\n            <th class=\"px-5 py-3\">PO<\u002Fth>\n            <th class=\"px-5 py-3\">Consignor → Consignee<\u002Fth>\n            <th class=\"px-5 py-3\"><button @click=\"setSort('submitted')\" class=\"inline-flex items-center gap-1\">Submitted <Icon :name=\"sortIcon('submitted')\" :size=\"12\"/><\u002Fbutton><\u002Fth>\n            <th class=\"px-5 py-3\">Status<\u002Fth>\n            <th class=\"px-5 py-3\">BC sync<\u002Fth>\n            <th><\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody class=\"divide-y divide-slate-100\">\n          <tr v-for=\"o in filtered\" :key=\"o.id\" @click=\"$router.push('/orders/'+o.id)\" class=\"hover:bg-slate-50 cursor-pointer\">\n            <td class=\"px-5 py-3 font-mono text-xs font-medium text-navy-900\">{{ o.id }}<\u002Ftd>\n            <td class=\"px-5 py-3\"><span class=\"w-7 h-7 rounded bg-slate-100 inline-flex items-center justify-center text-[10px] font-semibold text-slate-600\">{{ o.facility }}<\u002Fspan><\u002Ftd>\n            <td class=\"px-5 py-3\">\n              <div class=\"flex items-center gap-2\">\n                <TreatmentChip :treatmen er created · ' + this.order.exsitedId, icon:'receipt', done:true },\n      ];\n      if (this.order.bcSync === 'pending')  e.push({ ts:this.order.submitted+'T09:14', label:'Business Central sync queued', icon:'clock', done:false });\n      if (this.order.bcSync === 'syncing')  e.push({ ts:this.order.submitted+'T09:14', label:'Business Central sync in progress', icon:'refresh-cw', done:false, pulse:true });\n      if (this.order.bcSync === 'synced')   e.push({ ts:this.order.submitted+'T09:20', label:'BC customer invoice created · ' + this.order.bcId, icon:'check-circle-2', done:true });\n      if (this.order.bcSync === 'failed')   e.push({ ts:this.order.submitted+'T09:18', label:'BC sync failed — will retry', icon:'x-circle', done:false, fail:true });\n      if (this.order.bcSync === 'dead')     e.push({ ts:this.order.submitted+'T09:40', label:'BC sync moved to dead-letter queue', icon:'alert-octagon', done:false, fail:true });\n      if (['In treatment','Awaiting collection','Completed'].includes(this.order.status))\n        e.push({ ts: this.order.collection+'T06:00', label:'Goods received at facility', icon:'package-check', done:true });\n      if (['In treatment','Completed'].includes(this.order.status))\n        e.push({ ts: this.order.collection+'T11:30', label:'Treatment started', icon:'radiation', done:true });\n      if (this.order.status === 'Awaiting collection')\n        e.push({ ts: this.order.collection+'T15:00', label:'Awaiting customer collection', icon:'truck', done:false });\n      if (this.order.status === 'Completed')\n        e.push({ ts: this.order.collection+'T16:00', label:'Released to consignee', icon:'badge-check', done:true });\n      return e;\n    }\n  },\n  methods:{ fmtDate, fmtMoney }\n  ,template:`\n  <div v-if=\"!order\" class=\"p-12 text-slate-500\">Order not found.<\u002Fdiv>\n  <div v-else class=\"p-8 max-w-[1400px]\">\n    <!-- Breadcrumb -->\n    <div class=\"flex items-center gap-2 text-xs text-slate-500 mb-4\">\n      <router-          <div class=\"flex-1\"><div class=\"font-medium text-navy-900\">coa-{{ order.id.toLowerCase() }}.pdf<\u002Fdiv><div class=\"text-xs text-slate-500\">92 KB · uploaded at submission<\u002Fdiv><\u002Fdiv>\n              <button class=\"text-teal-600 text-xs hover:underline\">Download<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n      <!-- Right: metadata / timeline -->\n      <div class=\"space-y-4\">\n        <section class=\"bg-white border border-slate-200 rounded-lg shadow-card\">\n          <header class=\"px-5 py-3 border-b border-slate-100 font-semibold text-sm text-navy-900\">Integrations<\u002Fheader>\n          <div class=\"p-5 space-y-3 text-sm\">\n            <div class=\"flex items-center justify-between\">\n              <div class=\"text-slate-500 text-xs uppercase tracking-wider\">Exsited<\u002Fdiv>\n              <span class=\"text-emerald-600 text-xs inline-flex items-center gap-1\"><Icon name=\"check-circle-2\" :size=\"12\"/>Created<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"font-mono text-navy-900\">{{ order.exsitedId }}<\u002Fdiv>\n            <hr class=\"border-slate-100\"/>\n            <div class=\"flex items-center justify-between\">\n              <div class=\"text-slate-500 text-xs uppercase tracking-wider\">Business Central<\u002Fdiv>\n              <BcSyncChip :status=\"order.bcSync\" small/>\n            <\u002Fdiv>\n            <div class=\"font-mono text-navy-900\">{{ order.bcId }}<\u002Fdiv>\n            <div v-if=\"order.bcSync==='failed' || order.bcSync==='dead'\" class=\"mt-2 bg-red-50 border border-red-200 text-red-800 rounded p-3 text-xs\">\n              Last error: <span class=\"font-mono\">BC-422: customer credit hold<\u002Fspan>. Retry scheduled.\n              <button class=\"mt-2 text-red-700 underline\">Retry now<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section class=\"bg-white el><input type=\"password\" v-model=\"pwd.next\" class=\"w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus-ring\"/><\u002Fdiv>\n      <div><label class=\"block text-xs font-medium text-slate-700 mb-1\">Confirm new password<\u002Flabel><input type=\"password\" v-model=\"pwd.confirm\" class=\"w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus-ring\"/><\u002Fdiv>\n      <div class=\"text-[11px] text-slate-500\">Minimum 12 characters · 1 uppercase · 1 number · 1 symbol<\u002Fdiv>\n      <div class=\"pt-4 border-t border-slate-100 flex justify-end\"><Btn icon=\"lock\" action=\"save\">Update password<\u002FBtn><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Commodities -->\n    <div v-if=\"tab==='commodities'\" class=\"space-y-3\">\n      <div class=\"flex items-center justify-between\">\n        <div class=\"text-sm text-slate-500\"><strong class=\"text-navy-900\">{{ state.commodities.length }}<\u002Fstrong> commodities · shared across all facilities<\u002Fdiv>\n        <Btn icon=\"plus\" @click=\"addRow('commodities')\">Add commodity<\u002FBtn>\n      <\u002Fdiv>\n      <div class=\"bg-white border border-slate-200 rounded-lg shadow-card overflow-hidden\">\n        <table class=\"w-full text-sm\">\n          <thead class=\"bg-slate-50 text-left text-xs text-slate-500 uppercase tracking-wider\">\n            <tr><th class=\"px-5 py-3\">Name<\u002Fth><th class=\"px-5 py-3\">Tariff code<\u002Fth><th class=\"px-5 py-3\">Treatment<\u002Fth><th class=\"px-5 py-3\">Default dose (kGy)<\u002Fth><th class=\"px-5 py-3\">Notes<\u002Fth><th><\u002Fth><\u002Ftr>\n          <\u002Fthead>\n          <tbody class=\"divide-y divide-slate-100\">\n            <tr v-for=\"(c,i) in state.commodities\" :key=\"c.id\">\n              <td class=\"px-5 py-2\"><input v-model=\"c.name\" class=\"w-full rounded border border-transparent hover:border-slate-200 focus:border-teal-500 px-2 py-1 text-sm focus-ring\"/><\u002Ftd>\n              <td class=\"px-5 py-2 font-mono text-xs\"><input v-model=\"c.tariffCode\" class=\"w-full rounded border border-transparent hover:border-slate-200 focus:border-teal-500 px-2 py-1 font-mono text-xs focus-ring\"/><\u002Ftd>\n              <td class=\"px-5 py-2\">\n                <select v-model=\"c.treatment\" class=\"rounded border border-transparent hover:border-slate-200 focus:border-teal-500 px-2 py-1 text-sm focus-ring bg-transparent\">\n                  <option>Gamma<\u002Foption><option>ETO<\u002Foption><option>GMP<\u002Foption><option>Gamma+ETO<\u002Foption>\n                <\u002Fselect>\n                <TreatmentChip :treatment=\"c.treatment\" class=\"ml-1\"/>\n              <\u002Ftd>\n              <td class=\"px-5 py-2\"><input type=\"number\" v-model.number=\"c.defaultDoseKGy\" step=\"0.5\" class=\"w-24 rounded border border-transparent hover:border-slate-200 focus:border-teal-500 px-2 py-1 text-sm focus-ring\"/><\u002Ftd>\n              <td class=\"px-5 py-2 text-slate-600\"><input v-model=\"c.notes\" class=\"w-full rounded border border-transparent hover:border-slate-200 focus:border-teal-500 px-2 py-1 text-sm focus-ring\"/><\u002Ftd>\n              <td class=\"px-5 py-2\"><button @click=\"removeRow('commodities', i)\" class=\"p-1 rounded hover:bg-red-50 text-slate-400 hover:text-red-600\"><Icon name=\"trash-2\" :size=\"14\"/><\u002Fbutton><\u002Ftd>\n            <\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Consignors / Consignees (shared renderer) -->\n    <template v-if=\"tab==='consignors' || tab==='consignees'\">\n      <div class=\"space-y-3\">\n        <div class=\"flex items-center justify-between\">\n          <div class=\"text-sm text-slate-500\"><strong class=\"text-navy-900\">{{ (tab==='consignors'?state.consignors:state.consignees).length }}<\u002Fstrong> {{ tab }} · shared across all facilities<\u002Fdiv>\n          <Btn icon=\"plus\" @click=\"addRow(tab)\">Add {{ tab.slice(0,-1) }}<\u002FBtn>\n        <\u002Fdiv> Fselect>\n            <\u002Fdiv>\n            <div>\n              <label class=\"text-xs font-medium text-navy-900\">Postcode <span class=\"text-rose-600\">*<\u002Fspan><\u002Flabel>\n              <input v-model=\"f.addrPostcode\" type=\"text\" placeholder=\"3000\"\n                     class=\"mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus-ring\"/>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"px-6 sm:px-8 py-4 border-t border-slate-100 bg-slate-50 flex items-center gap-3 rounded-b-xl\">\n          <Btn kind=\"ghost\" icon=\"x\" @click=\"cancel\">Cancel<\u002FBtn>\n          <div class=\"flex-1\"><\u002Fdiv>\n          <Btn kind=\"primary\" iconRight=\"arrow-right\" :disabled=\"!step1Valid\" @click=\"next\">Next: Access<\u002FBtn>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ====================== STEP 2 ====================== -->\n      <div v-else class=\"space-y-6\">\n\n        <div class=\"bg-white border border-slate-200 rounded-xl\">\n          <div class=\"px-6 sm:px-8 py-5 border-b border-slate-100\">\n            <h2 class=\"font-semibold text-navy-900\">Access matrix<\u002Fh2>\n            <p class=\"text-xs text-slate-500 mt-0.5\">Tick the services this customer can submit at each facility. A facility is granted access automatically when at least one of its services is ticked.<\u002Fp>\n          <\u002Fdiv>\n\n          <div class=\"px-2 sm:px-4 py-4 overflow-x-auto\">\n            <table class=\"w-full text-sm\">\n              <thead>\n                <tr class=\"text-left\">\n                  <th class=\"px-4 py-3 text-[11px] font-semibold text-slate-500 uppercase tracking-wider\">Facility<\u002Fth>\n                  <th v-for=\"s in services\" :key=\"s\" class=\"px-4 py-3 text-[11px] font-semibold text-slate-500 uppercase tracking-wider text-center w-32\">\n                    <span :class=\"['inline-flex items-center px-2 py-0.5 rounded text-[10px] font-semibold border', treatmentColor(s)]\">{{ s }}<\u002Fspan>\n                  <\u002Fth>\n                <\u002Ftr>\n              <\u002Fthead>\n              <tbody class=\"divide-y divide-slate-100\">\n                <tr v-for=\"fac in facilities\" :key=\"fac.code\" class=\"hover:bg-slate-50/60\">\n                  <td class=\"px-4 py-4\">\n                    <div class=\"flex items-center gap-3\">\n                      <div class=\"w-9 h-9 rounded-lg bg-navy-50 text-navy-700 flex items-center justify-center text-[11px] font-bold\">{{ fac.code }}<\u002Fdiv>\n                      <div>\n                        <div class=\"font-semibold text-navy-900\">{{ fac.name }}<\u002Fdiv>\n                        <div class=\"text-[11px] text-slate-500\">{{ fac.state }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Ftd>\n                  <td v-for=\"s in services\" :key=\"s\" class=\"px-4 py-4 text-center\">\n                    <label v-if=\"canCheck[fac.code][s]\" class=\"inline-flex items-center justify-center cursor-pointer\">\n                      <input type=\"checkbox\" v-model=\"access[fac.code][s]\"\n                             class=\"w-4 h-4 rounded border-slate-300 text-amber-600 focus:ring-amber-500 cursor-pointer\"/>\n                    <\u002Flabel>\n                    <span v-else class=\"inline-flex items-center justify-center w-4 h-4 text-slate-300\" title=\"Service not offered at this facility\">\n                      <Icon name=\"minus\" :size=\"14\"/>\n                    <\u002Fspan>\n                  <\u002Ftd>\n                <\u002Ftr>\n              <\u002Ftbody>\n            <\u002Ftable>\n          <\u002Fdiv>\n\n          <div class=\"px-6 sm:px-8 py-3 border-t border-slate-100 bg-slate-50 text-[11px] text-slate-500 rounded-b-xl\">\n            <span v-if=\"grantedFacilities.length === 0\">No facilities selected yet.<\u002Fspan>\n            <span v-else>\n              <strong class=\" con, Btn, TreatmentChip },\n  computed:{\n    state(){ return state; },\n    customer(){ return state.customers.find(c => c.id === this.$route.params.id); },\n    facObjs(){ return (this.customer?.facilities || []).map(code => FACILITIES.find(f => f.code === code)).filter(Boolean); },\n    recentOrders(){\n      // Reuse seed orders, take first 5 as a mock\n      return state.orders.slice(0, 5);\n    },\n  },\n  methods:{\n    fmtDate, fmtMoney,\n    askImpersonate(){\n      const c = this.customer;\n      state.impersonateModal = { id:c.id, contact:c.contact, company:c.company };\n    },\n    statusCls(s){\n      if (s === 'Active')   return 'bg-emerald-100 text-emerald-800 ring-emerald-200';\n      if (s === 'Pending')  return 'bg-amber-100   text-amber-800   ring-amber-200';\n      if (s === 'Disabled') return 'bg-slate-100   text-slate-600   ring-slate-200';\n      return 'bg-slate-100 text-slate-700 ring-slate-200';\n    },\n  },\n  template:`\n    <div v-if=\"!customer\" class=\"px-6 py-12 max-w-6xl mx-auto text-sm text-slate-500\">Customer not found. <router-link to=\"/admin/customers\" class=\"text-teal-600 hover:underline\">← All customers<\u002Frouter-link><\u002Fdiv>\n    <div v-else class=\"px-6 sm:px-10 py-8 max-w-6xl mx-auto\">\n      <!-- Vertical-stack header -->\n      <div class=\"mb-6\">\n        <router-link to=\"/admin/customers\" class=\"text-xs text-slate-500 hover:text-navy-900 inline-flex items-center gap-1 mb-3 focus-ring rounded\">\n          <Icon name=\"arrow-left\" :size=\"14\"/> All customers\n        <\u002Frouter-link>\n        <div class=\"flex items-center gap-2 mb-2\">\n          <span class=\"inline-flex items-center gap-1 text-[10px] font-semibold uppercase tracking-wider px-2 py-1 rounded bg-amber-50 text-amber-700 border border-amber-200\">\n            <Icon name=\"user\" :size=\"11\"/> Admin · Customer\n          <\u002Fspan>\n          <span class=\"text-xs text-slate-400\">{{ customer.id }}<\u002Fspan>\n          <span :class=\"['inline-flex items-center text-[11px] font-medium px-2 py-0.5 rounded-full ring-1', statusCls(customer.status)]\">{{ customer.status }}<\u002Fspan>\n        <\u002Fdiv>\n        <h1 class=\"text-2xl font-semibold text-navy-900 leading-tight tracking-tight\">{{ customer.contact }}<\u002Fh1>\n        <p class=\"text-sm text-slate-500 mt-1\">{{ customer.company }} · joined {{ fmtDate(customer.created) }}<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"flex justify-end mb-4\">\n        <Btn @click=\"askImpersonate\" :disabled=\"customer.status === 'Disabled'\" icon=\"eye\" kind=\"primary\">View as Customer<\u002FBtn>\n      <\u002Fdiv>\n\n      <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-6\">\n        <!-- Left: Customer details -->\n        <div class=\"space-y-4\">\n          <div class=\"bg-white border border-slate-200 rounded-xl p-5\">\n            <h2 class=\"text-sm font-semibold text-navy-900 mb-3\">Contact<\u002Fh2>\n            <dl class=\"text-sm divide-y divide-slate-100\">\n              <div class=\"py-2 grid grid-cols-3 gap-2\"><dt class=\"text-slate-500\">Contact<\u002Fdt><dd class=\"col-span-2 text-navy-900\">{{ customer.contact }}<\u002Fdd><\u002Fdiv>\n              <div class=\"py-2 grid grid-cols-3 gap-2\"><dt class=\"text-slate-500\">Company<\u002Fdt><dd class=\"col-span-2 text-navy-900\">{{ customer.company }}<\u002Fdd><\u002Fdiv>\n              <div class=\"py-2 grid grid-cols-3 gap-2\"><dt class=\"text-slate-500\">Email<\u002Fdt><dd class=\"col-span-2 text-navy-900 break-all\">{{ customer.email }}<\u002Fdd><\u002Fdiv>\n              <div class=\"py-2 grid grid-cols-3 gap-2\"><dt class=\"text-slate-500\">Phone<\u002Fdt><dd class=\"col-span-2 text-navy-900\">{{ customer.phone }}<\u002Fdd><\u002Fdiv>\n              <div class=\"py-2 grid grid-cols-3 gap-2\"><dt class=\"text-slate-500\">Customer ID<\u002Fdt><dd class=\"col-span-2 text-slate-700 font-mono text-xs\">{{ customer.id }}<\u002Fdd><\u002Fdiv>\n            <\u002Fdl>\n          <\u002Fdiv>\n\n          <div class=\"bg-white border border-slate-200 rounded-xl p-5\">\n            <h2 class=\"text-sm font-semibold text-navy-900 mb-1\">Notes<\u002Fh2>\n            <p class=\"text-xs text-slate-500 mb-3\">Internal notes are not visible to the customer.<\u002Fp>\n            <div class=\"text-sm text-slate-400 italic\">No notes yet.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Right: Entitlements + Orders -->\n        <div class=\"space-y-4\">\n          <div class=\"bg-white border border-slate-200 rounded-xl p-5\">\n            <h2 class=\"text-sm font-semibold text-navy-900 mb-3\">Facility entitlements<\u002Fh2>\n            <div class=\"space-y-3\">\n              <div v-for=\"f in facObjs\" :key=\"f.code\" class=\"flex items-start justify-between gap-3 pb-3 border-b border-slate-100 last:border-0 last:pb-0\">\n                <div>\n                  <div class=\"text-sm font-medium text-navy-900\">{{ f.code }} · {{ f.name }}<\u002Fdiv>\n                  <div class=\"text-xs text-slate-500\">{{ f.address }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"flex flex-wrap gap-1 shrink-0\">\n                  <TreatmentChip v-for=\"s in customer.services.filter(svc => f.services.includes(svc))\" :key=\"s\" :treatment=\"s\"/>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"bg-white border border-slate-200 rounded-xl overflow-hidden\">\n            <div class=\"px-5 py-3 border-b border-slate-100 flex items-center justify-between\">\n              <h2 class=\"text-sm font-semibold text-navy-900\">Recent orders<\u002Fh2>\n              <span class=\"text-xs text-slate-500\">{{ customer.orders }} total<\u002Fspan>\n            <\u002Fdiv>\n            <div v-if=\"customer.status === 'Pending'\" class=\"px-5 py-8 text-center text-sm text-slate-500\">No orders yet — customer just signed up.<\u002Fdiv>\n            <table
