<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile Nav — Variants</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --accent:#FF7A1A;
    --accent-dark:#E06510;
    --text:#1E1E1E;
    --muted:#757575;
    --muted-2:#9E9E9E;
    --border:#E0E0E0;
    --border-light:#F0F0F0;
    --bg:#F8F9FB;
    --surface:#fff;
    --danger:#C62828;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#EFEFEF;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;color:#1E1E1E}
  /* Phone screen utilities */
  .phone-bg{background:var(--bg);width:100%;height:100%;overflow:hidden;position:relative}
  .phone-topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 8px 16px;background:#fff;border-bottom:0.5px solid var(--border-light);height:56px}
  .phone-topbar .brand{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--text);font-size:16px}
  .phone-topbar .brand .dot{width:24px;height:24px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
  .phone-topbar .right{display:flex;align-items:center;gap:10px}
  .bell-wrap{position:relative;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#1E1E1E}
  .bell-wrap .badge{position:absolute;top:-1px;right:-1px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:8px;min-width:14px;text-align:center;line-height:1.4}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600}
  .avatar.with-ring{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--accent)}
  /* Body content stand-in */
  .phone-body{padding:14px 16px;font-size:13px;color:var(--text);overflow:hidden}
  .greeting{font-size:11px;color:var(--muted);margin:0 0 2px}
  .h1{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-0.3px}
  .body-line{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.4}
  .body-line strong{color:#1E1E1E;font-weight:600}
  .hero-actions{display:flex;gap:8px;margin-bottom:14px}
  .hero-btn{flex:1;border-radius:8px;min-height:42px;font-size:13px;font-weight:600;border:1px solid var(--border);background:#fff;color:#1E1E1E;display:flex;align-items:center;justify-content:center;gap:6px}
  .hero-btn.primary{background:var(--accent);color:#fff;border:none}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .stat-card{background:#fff;border:1px solid var(--border-light);border-radius:10px;padding:10px}
  .stat-lbl{font-size:9px;font-weight:600;letter-spacing:0.4px;color:var(--muted);text-transform:uppercase;margin:0 0 4px}
  .stat-val{font-size:18px;font-weight:700;margin:0;letter-spacing:-0.4px}
  .stat-val.green{color:#2E7D32}
  .stat-val.orange{color:var(--accent)}
  .stat-sub{font-size:10px;color:var(--muted);margin:2px 0 0}
  .card{background:#fff;border:1px solid var(--border-light);border-radius:10px;padding:12px}
  .card-h{font-size:13px;font-weight:600;margin:0 0 4px}
  .card-sub{font-size:11px;color:var(--muted);margin:0 0 10px}
  /* Bottom nav (V1 + V2) */
  .bottom-nav{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid var(--border-light);height:64px;padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:space-around;align-items:stretch}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 4px;font-family:inherit;position:relative}
  .nav-item.active{color:var(--accent);font-weight:600}
  .nav-item.active .nav-ico{color:var(--accent)}
  .nav-ico{display:flex;color:var(--muted)}
  .nav-dot{position:absolute;top:8px;right:50%;transform:translateX(14px);width:7px;height:7px;border-radius:50%;background:var(--danger);border:1.5px solid #fff}
  /* Sheet overlay */
  .sheet-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease-out}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;background:#fff;border-radius:20px 20px 0 0;padding:0 0 16px;max-height:75%;overflow-y:auto;animation:slideUp .25s cubic-bezier(0.32,0.72,0.16,1)}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes slideRight{from{transform:translateX(-100%)}to{transform:translateX(0)}}
  .sheet-handle{width:36px;height:4px;background:#D9D9D9;border-radius:2px;margin:8px auto 0}
  .sheet-head{padding:14px 18px 8px;border-bottom:0.5px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
  .sheet-title{font-size:15px;font-weight:700;margin:0}
  .sheet-sub{font-size:11px;color:var(--muted);margin:1px 0 0}
  .sheet-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}
  .sheet-list{padding:6px 8px}
  .sheet-row{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;background:none;border:none;font-family:inherit;font-size:14px;color:var(--text);text-align:left;cursor:pointer;border-radius:10px;transition:background .15s}
  .sheet-row:hover{background:#F8F8F8}
  .sheet-row .ic{width:34px;height:34px;border-radius:9px;background:#FFF4EC;color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sheet-row .lbl{flex:1;font-weight:500}
  .sheet-row .lbl-sub{font-size:11px;color:var(--muted);font-weight:400;margin-top:1px}
  .sheet-row .chev{color:var(--muted-2)}
  .sheet-row.danger .ic{background:#FFEBEE;color:var(--danger)}
  .sheet-row.danger .lbl{color:var(--danger)}
  .sheet-divider{height:0.5px;background:var(--border-light);margin:6px 12px}
  .sheet-account{display:flex;align-items:center;gap:12px;padding:12px 18px 16px}
  .sheet-account .avatar{width:42px;height:42px;font-size:14px}
  .sheet-account-info{flex:1;min-width:0}
  .sheet-account-name{font-size:14px;font-weight:600;margin:0}
  .sheet-account-role{font-size:11px;color:var(--muted);margin:1px 0 0}
  .sheet-account-arrow{color:var(--muted-2)}
  /* Inbox screen content */
  .inbox-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:0.5px solid var(--border-light)}
  .inbox-row:last-child{border-bottom:none}
  .inbox-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:600}
  .inbox-icon.evidence{background:#E8F5E9;color:#2E7D32}
  .inbox-icon.quote{background:#FFF4EC;color:var(--accent)}
  .inbox-icon.message{background:#E3F2FD;color:#1565C0}
  .inbox-icon.alert{background:#FFEBEE;color:var(--danger)}
  .inbox-text{flex:1;min-width:0}
  .inbox-title{font-size:12.5px;font-weight:600;margin:0 0 2px;line-height:1.3}
  .inbox-sub{font-size:11px;color:var(--muted);margin:0;line-height:1.4}
  .inbox-time{font-size:10px;color:var(--muted-2);margin-top:3px}
  .inbox-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0}
  .filter-chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .chip{padding:5px 10px;border-radius:14px;font-size:11px;font-weight:500;background:#F0F0F0;color:#424242;border:none;white-space:nowrap;cursor:pointer}
  .chip.active{background:var(--accent);color:#fff}
  /* Account-page (V3 inline route) */
  .account-tile{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:12px;border:1px solid var(--border-light);margin-bottom:12px}
  .account-tile .avatar{width:44px;height:44px;font-size:14px}
  .account-tile-info{flex:1;min-width:0}
  .account-tile-name{font-size:14px;font-weight:600;margin:0}
  .account-tile-role{font-size:11px;color:var(--muted);margin:1px 0 0}
  .nav-list{background:#fff;border:1px solid var(--border-light);border-radius:12px;overflow:hidden}
  .nav-list-row{display:flex;align-items:center;gap:14px;padding:13px 14px;border-bottom:0.5px solid var(--border-light);cursor:pointer}
  .nav-list-row:last-child{border-bottom:none}
  .nav-list-row .ic{width:34px;height:34px;border-radius:9px;background:#FFF4EC;color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .nav-list-row .lbl{flex:1;font-size:13.5px;font-weight:500}
  .nav-list-row .chev{color:var(--muted-2)}
  /* Annotations on each phone */
  .ab-caption{display:flex;flex-direction:column;gap:6px;width:340px;padding:8px 4px}
  .ab-caption h3{margin:0;font-size:14px;font-weight:600;color:#1E1E1E;letter-spacing:-0.1px}
  .ab-caption p{margin:0;font-size:12px;color:#666;line-height:1.5}
  .ab-caption ul{margin:0;padding-left:16px;font-size:11.5px;color:#444;line-height:1.55}
  .ab-caption ul li{margin-bottom:2px}
  .ab-caption .pros{color:#2E7D32}
  .ab-caption .cons{color:#B71C1C}
  .ab-caption .label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;margin-top:6px;margin-bottom:2px}
  .badge-rec{display:inline-block;background:#E8F5E9;color:#2E7D32;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;letter-spacing:0.3px}
  .badge-cur{display:inline-block;background:#FFF4EC;color:var(--accent);font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;letter-spacing:0.3px}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="mobile-nav-variants.jsx"></script>
</head>
<body>
<div id="root"></div>
</body>
</html>
